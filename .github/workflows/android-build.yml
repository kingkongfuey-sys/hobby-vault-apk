name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fail early if logo is missing
        run: |
          [ -f logo.png ] || { echo "logo.png not found in repo root"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Swap in MainActivity and widget files
        run: |
          cp android-extra/MainActivity.java \
             android/app/src/main/java/com/hobbyvault/app/MainActivity.java
          cp android-extra/WidgetProvider.java \
             android/app/src/main/java/com/hobbyvault/app/WidgetProvider.java
          cp -r android-extra/res/xml android/app/src/main/res/
          cp -r android-extra/res/layout android/app/src/main/res/
          cp -r android-extra/res/drawable android/app/src/main/res/

      - name: Patch manifest (camera permission + widget receiver)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\
          <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\
          <uses-feature android:name="android.hardware.camera" android:required="false"/>\
          <application|' $M
          sed -i 's|</application>|  <receiver android:name=".WidgetProvider" android:exported="false">\
              <intent-filter>\
                <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>\
              </intent-filter>\
              <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_quick_add"/>\
            </receiver>\
          </application>|' $M
          grep -q 'CAMERA' $M || { echo "manifest patch failed"; exit 1; }
          grep -q 'APPWIDGET_UPDATE' $M || { echo "receiver patch failed"; exit 1; }

      - name: Prepare icon assets
        run: |
          mkdir -p assets
          cp logo.png assets/icon.png

      - name: Generate adaptive Android icons
        run: |
          npx capacitor-assets generate --android

      - name: Use fixed signing key
        run: |
          if [ -f android-extra/debug.keystore ]; then
            mkdir -p ~/.android
            cp android-extra/debug.keystore ~/.android/debug.keystore
            echo "Using fixed signing key"
          else
            echo "No android-extra/debug.keystore found"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hobby-vault-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

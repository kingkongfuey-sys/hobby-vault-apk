name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fail early if logo is missing
        run: |
          [ -f logo.png ] || { echo "logo.png not found in repo root"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Swap in MainActivity
        run: |
          cp android-extra/MainActivity.java \
             android/app/src/main/java/com/hobbyvault/app/MainActivity.java

      - name: Prepare icon assets
        run: |
          mkdir -p assets
          cp logo.png assets/icon.png

      - name: Generate adaptive Android icons
        run: |
          npx capacitor-assets generate --android

      - name: Use fixed signing key
        run: |
          if [ -f android-extra/debug.keystore ]; then
            mkdir -p ~/.android
            cp android-extra/debug.keystore ~/.android/debug.keystore
            echo "Using fixed signing key"
          else
            echo "No android-extra/debug.keystore found"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hobby-vault-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

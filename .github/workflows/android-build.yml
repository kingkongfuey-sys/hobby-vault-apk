name: Build APK

on:
  workflow_dispatch:      # adds a manual "Run workflow" button
  push:
    branches: [ main ]    # rebuilds on every change you make

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fail early if logo is missing
        run: |
          [ -f logo.png ] || { echo "logo.png not found in repo root"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor and plugins
        run: npm install

      - name: Generate the Android project
        run: npx cap add android

      - name: Register plugins (export, share, back button)
        run: npx cap sync android

      - name: Swap in our MainActivity
        run: |
          cp android-extra/MainActivity.java \
             android/app/src/main/java/com/hobbyvault/app/MainActivity.java

      - name: Generate app icon from logo.png
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q imagemagick
          sizes=(48 72 96 144 192)
          dpis=(mdpi hdpi xhdpi xxhdpi xxxhdpi)
          for i in "${!dpis[@]}"; do
            dpi="${dpis[$i]}"; size="${sizes[$i]}"
            dir="android/app/src/main/res/mipmap-$dpi"
            mkdir -p "$dir"
            convert logo.png -resize "${size}x${size}" "$dir/ic_launcher.png"
          done
          # Delete Capacitor's adaptive-icon XMLs so Android uses our PNGs
          find android/app/src/main/res -name "ic_launcher.xml" -delete
          find android/app/src/main/res -name "ic_launcher_round.xml" -delete

      - name: Use the fixed signing key (lets new builds update over old ones)
        run: |
          if [ -f android-extra/debug.keystore ]; then
            mkdir -p ~/.android
            cp android-extra/debug.keystore ~/.android/debug.keystore
            echo "Using fixed signing key"
          else
            echo "No android-extra/debug.keystore yet - this APK gets a random key and cannot update an existing install"
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: hobby-vault-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

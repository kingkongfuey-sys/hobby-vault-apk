name: Build APK

on:
  workflow_dispatch:      # adds a manual "Run workflow" button
  push:
    branches: [ main ]    # rebuilds on every change you make

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fail early if logo is missing
        run: |
          [ -f logo.png ] || { echo "logo.png not found in repo root"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install

      - name: Generate the Android project
        run: npx cap add android

      - name: Swap in our back-button code
        run: |
          cp android-extra/MainActivity.java \
             android/app/src/main/java/com/hobbyvault/app/MainActivity.java

      - name: Generate app icon from logo.png
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q imagemagick
          sizes=(48 72 96 144 192)
          dpis=(mdpi hdpi xhdpi xxhdpi xxxhdpi)
          for i in "${!dpis[@]}"; do
            dpi="${dpis[$i]}"; size="${sizes[$i]}"
            dir="android/app/src/main/res/mipmap-$dpi"
            mkdir -p "$dir"
            magick logo.png -resize "${size}x${size}" "$dir/ic_launcher.png"
          done

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: hobby-vault-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

<script>
'use strict';
/* ---------- helpers & icons ---------- */
const ROOT='root',$=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const byName=(a,b)=>a.name.localeCompare(b.name);
const fmtB=b=>b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const matchQ=(r,q)=>{const h=(r.name+' '+(r.category||'')+' '+(r.notes||'')+' '+(r.notes!=null?stLab(stOf(r)):'')).toLowerCase();return q.split(/\s+/).filter(Boolean).every(t=>h.includes(t))};
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={folder:svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
cube:svg('<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12 4 7.5"/>'),
dots:svg('<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'),
x:svg('<path d="M6 6l12 12M18 6 6 18"/>'),plus:svg('<path d="M12 5v14M5 12h14"/>'),down:svg('<path d="M6 9l6 6 6-6"/>'),
prev:svg('<path d="M15 6l-6 6 6 6"/>'),next:svg('<path d="M9 6l6 6-6 6"/>')};
ICON.cog=svg('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>');
ICON.search=svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>');
ICON.minus=svg('<path d="M5 12h14"/>');ICON.check=svg('<path d="M5 12.5l4.5 4.5L19 7"/>');
ICON.rot=svg('<path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/>');
const ACC={brass:{dark:['#c8974a','#1a1408'],light:['#9c6a17','#ffffff']},verdigris:{dark:['#4fb3a0','#04211c'],light:['#1f7a6a','#ffffff']},azure:{dark:['#6ea8e8','#071a30'],light:['#2a63b0','#ffffff']},violet:{dark:['#a992e6','#140c2b'],light:['#6a4bb5','#ffffff']}};
const SET=(()=>{const K='hv-settings';let s={theme:null,accent:'brass',motion:true,sort:'az',flat:false,quality:'standard',layout:'list'};
 try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
 const sys=matchMedia('(prefers-color-scheme: light)'),theme=()=>s.theme||(sys.matches?'light':'dark');
 const apply=()=>{const t=theme(),r=document.documentElement,a=(ACC[s.accent]||ACC.brass)[t];r.dataset.theme=t;r.dataset.motion=s.motion?'on':'off';r.dataset.layout=s.layout==='grid'?'grid':'list';
  r.style.setProperty('--ac',a[0]);r.style.setProperty('--acx',a[1]);$('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue('--bg').trim()};
 const set=(k,v)=>{s[k]=v;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}apply()};
 sys.addEventListener&&sys.addEventListener('change',()=>{if(!s.theme)apply()});apply();
 return{get:()=>s,theme,set}})();
$('#add').innerHTML=ICON.plus;$('#cog').innerHTML=ICON.cog;$('#cog').onclick=()=>openSettings();$('#srch').innerHTML=ICON.search;$('#srch').onclick=()=>guard(openSearch)();

/* ---------- DB layer ---------- */
const DB=(()=>{let db;
const R=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const T=(s,m='readonly')=>db.transaction(s,m);
const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Transaction aborted'))});
const open=()=>new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('IndexedDB is not available'));
 const r=indexedDB.open('hobby-vault',2);
 r.onupgradeneeded=()=>{const d=r.result;
  if(!d.objectStoreNames.contains('collections')){
   d.createObjectStore('collections',{keyPath:'id'}).createIndex('parentId','parentId');
   d.createObjectStore('items',{keyPath:'id'}).createIndex('parentId','parentId');
   d.createObjectStore('photos',{keyPath:'id'}).createIndex('itemId','itemId')}
  const ps=r.transaction.objectStore('photos');if(!ps.indexNames.contains('itemOrder'))ps.createIndex('itemOrder',['itemId','sortOrder'])};
 r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('Database is blocked by another tab'))});
const get=(s,id)=>R(T(s).objectStore(s).get(id));
const put=async(s,o)=>{const t=T(s,'readwrite');t.objectStore(s).put(o);await done(t);return o};
const by=(s,ix,k)=>R(T(s).objectStore(s).index(ix).getAll(IDBKeyRange.only(k)));
const count=(s,k)=>R(T(s).objectStore(s).index('parentId').count(IDBKeyRange.only(k)));
const photos=async id=>(await by('photos','itemId',id)).sort((a,b)=>a.sortOrder-b.sortOrder);
const delPhoto=async id=>{const t=T('photos','readwrite');t.objectStore('photos').delete(id);await done(t)};
const putPhotos=async list=>{const t=T('photos','readwrite');list.forEach(p=>t.objectStore('photos').put(p));await done(t)};
const wipe=async(cols,items)=>{const t=T(['collections','items','photos'],'readwrite');
 const c=t.objectStore('collections'),i=t.objectStore('items'),p=t.objectStore('photos'),ix=p.index('itemId');
 cols.forEach(id=>c.delete(id));
 for(const id of items){i.delete(id);(await R(ix.getAllKeys(IDBKeyRange.only(id)))).forEach(k=>p.delete(k))}
 await done(t)};
const photoCounts=()=>new Promise((ok,no)=>{const m=new Map(),r=T('photos').objectStore('photos').index('itemId').openKeyCursor();
 r.onsuccess=()=>{const c=r.result;if(!c)return ok(m);m.set(c.key,(m.get(c.key)||0)+1);c.continue()};r.onerror=()=>no(r.error)});
const thumbs=ids=>new Promise((ok,no)=>{const m=new Map();ids=[...new Set(ids)];if(!ids.length)return ok(m);
 const t=T('photos'),st=t.objectStore('photos'),io=st.index('itemOrder'),ii=st.index('itemId');let left=ids.length;const fin=()=>{if(!--left)ok(m)};
 t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Thumbnail read failed'));
 ids.forEach(id=>{const r=io.openCursor(IDBKeyRange.bound([id,-Infinity],[id,Infinity]));
  r.onsuccess=()=>{const c=r.result;if(c){m.set(id,c.value.thumb||c.value.blob);return fin()}
   /* fallback for any legacy record without a sortOrder */
   const n=ii.count(IDBKeyRange.only(id));n.onsuccess=()=>{if(!n.result)return fin();
    const g=ii.getAll(IDBKeyRange.only(id));g.onsuccess=()=>{const l=g.result.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0))[0];if(l)m.set(id,l.thumb||l.blob);fin()}}}})});
const all=s=>R(T(s).objectStore(s).getAll());
const usage=async()=>{const r=await new Promise((ok,no)=>{let n=0,b=0;const q=T('photos').objectStore('photos').openCursor();
 q.onsuccess=()=>{const c=q.result;if(!c)return ok({n,b});const v=c.value;n++;b+=(v.blob?v.blob.size:0)+(v.thumb?v.thumb.size:0);c.continue()};q.onerror=()=>no(q.error)});
 (await all('collections')).forEach(c=>{if(c.icon instanceof Blob)r.b+=c.icon.size});return r};
const setThumb=(id,thumb)=>new Promise((ok,no)=>{const t=T('photos','readwrite'),st=t.objectStore('photos'),g=st.get(id);
 g.onsuccess=()=>{const v=g.result;if(v){v.thumb=thumb;v.th=2;st.put(v)}};t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Transaction aborted'))});
const photoKeys=()=>R(T('photos').objectStore('photos').getAllKeys());
const replaceAll=async d=>{const t=T(['collections','items','photos'],'readwrite');
 for(const n of ['collections','items','photos']){const o=t.objectStore(n);o.clear();(d[n]||[]).forEach(r=>o.put(r))}await done(t)};
const delItem=id=>wipe([],[id]);
const delCollection=async id=>{const cols=[id],items=[];
 for(let n=0;n<cols.length;n++){(await by('collections','parentId',cols[n])).forEach(c=>cols.push(c.id));
  (await by('items','parentId',cols[n])).forEach(x=>items.push(x.id))}
 await wipe(cols,items)};
return{setThumb,usage,photoKeys,thumbs,all,replaceAll,open,get,put,by,count,photoCounts,photos,delPhoto,putPhotos,delItem,delCollection}})();

/* ---------- motion system (tokens live in CSS) ---------- */
const M=(()=>{const RMQ=matchMedia('(prefers-reduced-motion: reduce)'),RM={get matches(){return RMQ.matches||document.documentElement.dataset.motion==='off'}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const px=n=>RM.matches?0:n;
const run=(e,kf,k='med',o={})=>e.animate(kf,{duration:parseFloat(css('--dur-'+k)),easing:css('--ease'),fill:'backwards',...o}).finished.catch(()=>{});
const enter=(e,delay=0)=>run(e,[{opacity:0,transform:`translateY(${px(8)}px)`},{opacity:1,transform:'none'}],'med',{delay});
const pop=e=>run(e,[{opacity:0,transform:`scale(${RM.matches?1:.85})`},{opacity:1,transform:'none'}],'slow');
const out=e=>run(e,[{opacity:1,transform:'none'},{opacity:0,transform:`scale(${RM.matches?1:.8})`}],'med',{fill:'forwards'});
const fade=(e,a,b,k='med',o={})=>run(e,[{opacity:a},{opacity:b}],k,o);
const stagger=list=>{const per=RM.matches?0:Math.min(25,240/Math.max(list.length,1));list.forEach((e,i)=>enter(e,i*per))}; // max ~240ms delay + 220ms = <500ms
const flip=(g,fn)=>{const first=new Map([...g.children].map(c=>[c,c.getBoundingClientRect()]));fn();
 if(RM.matches)return;[...g.children].forEach(c=>{const f=first.get(c);if(!f)return;const l=c.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
  if(dx||dy)run(c,[{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}])})};
return{run,px,enter,pop,out,fade,stagger,flip}})();

/* ---------- toast, errors, dialog ---------- */
function toast(m,err,undo){const t=el('div','toast'+(err?' err':'')),l=el('span');l.textContent=m;t.append(l);
 if(undo){const b=el('button','tundo','Undo');b.onclick=async()=>{b.disabled=true;t.remove();try{await undo()}catch(e){toast(e&&e.message||'Could not undo',true)}};t.append(b)}
 $('#toasts').append(t);M.run(t,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}]);
 setTimeout(async()=>{if(!t.isConnected)return;await M.fade(t,1,0,'slow',{fill:'forwards'});t.remove()},undo?6000:3000)}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){console.error(e);toast(e&&e.message||'Something went wrong',true)}};

function dlg({title,msg,input,ok='OK',danger,choices}){return new Promise(res=>{
 const bd=el('div','backdrop'),d=el('div','dlg');d.setAttribute('role','dialog');
 d.innerHTML=`<h2>${esc(title)}</h2>${msg?`<p>${esc(msg)}</p>`:''}${input!=null?`<input maxlength="80" placeholder="Name" value="${esc(input)}">`:''}<div class="row${choices?'':' h'}"></div>`;
 const row=$('.row',d),inp=$('input',d);let fin=false;
 const close=async v=>{if(fin)return;fin=true;M.fade(bd,1,0,'med',{fill:'forwards'});
  await M.run(d,[{opacity:1,transform:'none'},{opacity:0,transform:`scale(.94) translateY(${M.px(8)}px)`}],'med',{fill:'forwards'});bd.remove();res(v)};
 const add=(l,v,c)=>{const b=el('button','btn '+c,esc(l));b.onclick=()=>close(v);row.append(b);return b};
 if(choices)choices.forEach(c=>{const b=add(c.label,c.value,'ghost'+(c.danger?' danger':''));
  if(c.pick)b.onclick=()=>{const f=el('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(f.files[0])close({file:f.files[0]})};f.click()}});
 add('Cancel',null,'ghost');
 if(!choices){const b=add(ok,true,danger?'danger':'');b.onclick=()=>{if(inp){const v=inp.value.trim();if(!v)return inp.focus();close(v)}else close(true)}}
 bd.onclick=e=>{if(e.target===bd)close(null)};
 bd.onkeydown=e=>{if(e.key==='Escape')close(null);if(e.key==='Enter'&&inp)$('.btn:last-child',row).click()};
 bd.append(d);document.body.append(bd);M.fade(bd,0,1);
 M.run(d,[{opacity:0,transform:`scale(.94) translateY(${M.px(8)}px)`},{opacity:1,transform:'none'}],'slow');
 (inp||$('.btn',d)).focus();inp&&inp.select()})}

async function okName(name,parentId,kind,skipId){const k=name.trim().toLowerCase(),list=await DB.by(kind==='c'?'collections':'items','parentId',parentId);
 if(!list.some(x=>x.id!==skipId&&String(x.name).trim().toLowerCase()===k))return true;
 return !!await dlg({title:'Name already used',msg:`There is already ${kind==='c'?'a collection':'a model'} called “${name}” here. Use the name anyway?`,ok:'Use anyway'})}

/* ---------- navigation & grid ---------- */
let cur=ROOT,nav=0;const stage=$('#stage'),crumbs=$('#crumbs');
const live=()=>$('.view:not(.leaving)',stage);
async function pathOf(id){const p=[];while(id!==ROOT){const c=await DB.get('collections',id);if(!c)break;p.unshift(c);id=c.parentId}return p}
const skeleton=()=>`<div class="grid">${'<div class="card sk"><div class="ph"></div><div class="lab"><b>Loading</b></div></div>'.repeat(6)}</div>`;

const go=guard(async(id,dir=0)=>{resetS();clearSel();const my=++nav,path=await pathOf(id);if(my!==nav)return;
 cur=path.length?path[path.length-1].id:ROOT;loadF();
 crumbs.innerHTML='';[{id:ROOT,name:'Vault'},...path].forEach((c,i,a)=>{if(i)crumbs.append(el('i','','›'));
  const b=el('button','',esc(c.name));if(i===a.length-1)b.setAttribute('aria-current','page');else b.onclick=()=>go(c.id,-1);crumbs.append(b)});
 crumbs.scrollLeft=1e5;
 const old=live(),v=el('div','view',skeleton());
 if(old){old.classList.add('leaving');
  M.run(old,[{transform:'none',opacity:1},{transform:`translateX(${-dir*M.px(36)}px)`,opacity:0}],'med',{fill:'forwards'})
   .then(()=>{(old._urls||[]).forEach(URL.revokeObjectURL);old.remove()})}
 stage.append(v);
 M.run(v,[{transform:`translateX(${dir*M.px(36)}px)`,opacity:0},{transform:'none',opacity:1}]);
 await fill(v)});

const STATUS=[['unbuilt','Unbuilt'],['built','Built'],['primed','Primed'],['painted','Painted'],['complete','Complete']];
const stOf=r=>{const k=r.status==='based'?'complete':r.status;return STATUS.some(x=>x[0]===k)?k:'unbuilt'},stLab=k=>STATUS.find(x=>x[0]===k)[1];
const qtyOf=r=>Number.isInteger(r.qty)?r.qty:1;
function qtyCtl(rec){const w=el('div','qty');
 w.innerHTML=`<button type="button" aria-label="One fewer">${ICON.minus}</button><input type="number" inputmode="numeric" min="0" max="999" aria-label="Quantity"><button type="button" aria-label="One more">${ICON.plus}</button>`;
 const[m,p]=w.querySelectorAll('button'),i=$('input',w);i.value=qtyOf(rec);
 const set=guard(async n=>{n=Math.max(0,Math.min(999,Math.round(n)||0));i.value=n;if(rec.qty===n)return;rec.qty=n;await DB.put('items',rec)});
 m.onclick=()=>set(qtyOf(rec)-1);p.onclick=()=>set(qtyOf(rec)+1);i.onchange=()=>set(+i.value);
 w.onclick=e=>e.stopPropagation();return w}

/* ---------- undo snapshots ---------- */
async function snapItems(items){return{cols:[],items,photos:(await Promise.all(items.map(i=>DB.photos(i.id)))).flat()}}
async function snapOf(kind,id){const[C,I]=await Promise.all([DB.all('collections'),DB.all('items')]);if(kind==='i')return snapItems(I.filter(i=>i.id===id));
 const cs=new Set([id]);for(let more=true;more;){more=false;C.forEach(c=>{if(!cs.has(c.id)&&cs.has(c.parentId)){cs.add(c.id);more=true}})}

 L.push(`In the backup: ${pl(d.collections.length,'collection')}, ${pl(d.items.length,'model')}, ${pl(good.length,'photo')}.`);

 if(lessI>0||lessP>0)L.push(`Warning: the backup has ${[lessI>0?lessI+' fewer model'+(lessI===1?'':'s'):'',lessP>0?lessP+' fewer photo'+(lessP===1?'':'s'):''].filter(Boolean).join(' and ')} than you have now. Anything added since will be lost.`);
 if(badC.length+badI.length){const n=badC.length+badI.length;L.push(`${n} entr${n===1?'y sits':'ies sit'} inside collections that are missing from the backup and will be moved to the top level.`)}

 if(free!=null&&size*1.5>free)L.push(`Warning: low storage. The app has about ${fmtB(Math.max(0,free))} available and this import may need about ${fmtB(Math.round(size*1.5))}.`);

 return{msg:L.join('\n'),fix(){badC.forEach(c=>c.parentId=ROOT);badI.forEach(x=>x.parentId=ROOT);d.photos=good}}}

  if(d.app!=='hobby-vault'||![d.collections,d.items,d.photos].every(Array.isArray))throw new Error('That file is not a Hobby Vault backup');
  const rp=await checkBackup(d,f.size);if(!await dlg({title:'Replace everything?',msg:rp.msg,ok:'Replace',danger:true}))return;rp.fix();
  d.collections=d.collections.map(x=>{const{icon,...r}=x;return typeof icon==='string'?{...r,icon:d2b(icon)}:r});
  d.photos=d.photos.map(p=>({...p,blob:d2b(p.blob),thumb:p.thumb?d2b(p.thumb):undefined}));
  await DB.replaceAll(d);await afterReplace();toast('Backup imported')});
 $('.imp',sh).onclick=()=>imp.click();
 $('.del',sh).onclick=guard(async()=>{if(!await dlg({title:'Delete all data?',msg:'Every collection, model and photo will be permanently removed. Export a backup first if you may want them back.',ok:'Delete everything',danger:true}))return;
  await DB.replaceAll({});await afterReplace();toast('All data deleted')});
 $('.back',sh).onclick=async()=>{await M.run(sh,[{transform:'none'},{transform:'translateY(100%)'}],'slow',{fill:'forwards'});sh.remove()};
 document.body.append(sh);M.run(sh,[{transform:'translateY(100%)'},{transform:'none'}],'slow')}

/* ---------- gestures: pinch for list/grid, tap the title or breadcrumb bar to jump to the top ---------- */
function setLayout(l){if(SET.get().layout===l)return;SET.set('layout',l);try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
 const v=live(),b=v&&$('.content',v);b&&M.run(b,[{opacity:.2,transform:'scale(.97)'},{opacity:1,transform:'none'}],'med')}
(()=>{const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);let d0=0,fired=false,wAt=0;
 stage.addEventListener('touchstart',e=>{if(e.touches.length===2){d0=dist(e.touches);fired=false}else d0=0},{passive:true});
 stage.addEventListener('touchmove',e=>{if(e.touches.length!==2||!d0||fired)return;const r=dist(e.touches)/d0;
  if(r<.78){fired=true;setLayout('grid')}else if(r>1.28){fired=true;setLayout('list')}},{passive:true});
 stage.addEventListener('touchend',e=>{if(e.touches.length<2)d0=0},{passive:true});
 stage.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const n=Date.now();if(n-wAt<450)return;wAt=n;setLayout(e.deltaY>0?'grid':'list')},{passive:false});
 const toTop=()=>scrollTo({top:0,behavior:document.documentElement.dataset.motion==='off'?'auto':'smooth'});
 const h=$('.top h1');h.onclick=toTop;h.style.cursor='pointer';crumbs.addEventListener('click',e=>{if(e.target===crumbs)toTop()})})();

/* ---------- back button (Android hardware/gesture back in Capacitor) ---------- */
function handleBack(){
 const lb=$('.lb');if(lb){lb.click();return true}
 const dd=$('.ddbg');if(dd){dd.click();return true}
 const bd=$('.backdrop');if(bd){bd.click();return true}
 const sheets=[...document.querySelectorAll('.sheet')];
 if(sheets.length){const open=sheets.filter(x=>!x.dataset.closing);if(!open.length)return true;
  const top=open.find(x=>x.classList.contains('set'))||open[open.length-1],b=$('.back',top);
  if(b){top.dataset.closing='1';b.click();return true}}
 if(SEL.size){clearSel();return true}
 if(cur!==ROOT){const b=[...crumbs.querySelectorAll('button')];if(b.length>1){b[b.length-2].click();return true}}
 return false}
(()=>{const A=plug('App');if(!A||!A.addListener)return;let last=0;
 A.addListener('backButton',()=>{if(handleBack())return;const t=Date.now();if(t-last<2000){A.exitApp&&A.exitApp();return}last=t;toast('Press back again to exit')})})();

(()=>{const A=plug('App');if(!A||!A.addListener)return;A.addListener('appStateChange',st=>{if(st&&st.isActive)setTimeout(abCheck,1500)})})();

/* ---------- start ---------- */
(async()=>{try{await DB.open()}catch(e){stage.innerHTML=`<div class="empty"><h2>Storage unavailable</h2><p>${esc(e.message)}</p></div>`;toast(e.message,true);return}
 go(ROOT,0);setTimeout(abCheck,4000);setTimeout(()=>{let d='';try{d=localStorage.getItem('hv-th')}catch(_){}if(d!=='2')rebuildThumbs(false).catch(()=>{})},2500)})();
</script></body></html>

const STATUS=[['unbuilt','Unbuilt'],['built','Built'],['primed','Primed'],['painted','Painted'],['complete','Complete']];
const stOf=r=>{const k=r.status==='based'?'complete':r.status;return STATUS.some(x=>x[0]===k)?k:'unbuilt'},stLab=k=>STATUS.find(x=>x[0]===k)[1];
const qtyOf=r=>Number.isInteger(r.qty)?r.qty:1;
/* A unit can be split across statuses: r.split = {painted:4,primed:6}. It only counts while it adds up to the quantity; otherwise the single status field is used. */
const sq0=r=>Math.max(0,qtyOf(r));
const segs=r=>{const q=sq0(r),sp=r.split;
 if(sp&&typeof sp==='object'){const out=STATUS.map(([k])=>({status:k,qty:Math.max(0,Math.floor(+sp[k]||0))})).filter(x=>x.qty>0);if(out.length&&out.reduce((a,x)=>a+x.qty,0)===q)return out}
 return[{status:stOf(r),qty:q}]};
const doneOf=r=>{const q=sq0(r);if(!q)return STW[stOf(r)];return segs(r).reduce((a,x)=>a+x.qty*STW[x.status],0)/q}; /* 0..1 weighted completion of one entry, split units included */
const stText=r=>{const s=segs(r);return s.length>1?s.map(x=>`${x.qty} ${stLab(x.status)}`).join(', '):stLab(s[0].status)};
/* one pseudo-record per status segment, so every count, filter and total works on plain status + quantity */
const expand=l=>l.flatMap(r=>r.split?segs(r).map(x=>({...r,status:x.status,qty:x.qty,split:undefined})):[r]);
function setSplit(r,cnt){const used=STATUS.filter(([k])=>cnt[k]>0);
 if(used.length<=1){delete r.split;if(used.length)r.status=used[0][0];return}
 r.split=Object.fromEntries(used.map(([k])=>[k,cnt[k]]));r.status=used.slice().sort((a,b)=>cnt[b[0]]-cnt[a[0]])[0][0]}
function fitSplit(r){if(!r.split)return;if(typeof r.split!=='object'){delete r.split;return}
 const q=sq0(r),cnt=Object.fromEntries(STATUS.map(([k])=>[k,Math.max(0,Math.floor(+r.split[k]||0))]));let sum=STATUS.reduce((a,[k])=>a+cnt[k],0);
 if(sum<q)cnt.unbuilt+=q-sum;else if(sum>q){let x=sum-q;for(const[k]of STATUS){const t=Math.min(cnt[k],x);cnt[k]-=t;x-=t;if(!x)break}}
 setSplit(r,cnt)}

const load=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('Could not read that image'));i.src=u});

  const dup=!!((sh&&seen.has(sh))||(bh&&seen.has(bh)));if(sh)seen.add(sh);if(bh)seen.add(bh);out.push({f,blob,thumb,sh,bh,dup})}catch(e){toast(e.message||'Could not add photo',true)}}
 const d=out.filter(x=>x.dup);

async function checkBackup(d,size){
 const[cc,ci,ck]=await Promise.all([DB.all('collections'),DB.all('items'),DB.photoKeys()]);

 if(badC.length+badI.length){const n=badC.length+badI.length;L.push(`${n} entr${n===1?'y sits':'ies sit'} inside collections that are missing from the backup and will be moved to the top level.`)}

/* ---------- Merge / Skip Duplicates import: models and collections match by ID, the backup wins on Merge ---------- */
async function mergeBackup(d,size,skip){
 const[cc,ci,ck]=await Promise.all([DB.all('collections'),DB.all('items'),DB.photoKeys()]);
 const hc=new Set(cc.map(c=>c.id)),hi=new Set(ci.map(i=>i.id)),hp=new Set(ck);
 const inC=d.collections.filter(c=>c&&c.id),inI=d.items.filter(x=>x&&x.id);
 const dupC=inC.filter(c=>hc.has(c.id)),dupI=inI.filter(x=>hi.has(x.id)),newC=inC.filter(c=>!hc.has(c.id)),newI=inI.filter(x=>!hi.has(x.id));
 const useC=(skip?newC:inC).map(c=>({...c})),useI=(skip?newI:inI).map(x=>({...x})),okI=new Set(useI.map(x=>x.id));
 const photos=d.photos.filter(p=>p&&p.id&&okI.has(p.itemId)&&typeof p.blob==='string'&&p.blob.startsWith('data:')&&!(skip&&hp.has(p.id)));
 const newP=photos.filter(p=>!hp.has(p.id)).length;
 if(!useC.length&&!useI.length&&!photos.length){toast('Nothing to import: everything in the backup is already here');return}
 const L=[`In the backup: ${plu(inC.length,'collection')}, ${plu(inI.length,'model')}, ${plu(d.photos.length,'photo')}.`,
  `New: ${plu(newC.length,'collection')}, ${plu(newI.length,'model')}, ${plu(newP,'photo')}.`,
  `Already here (same ID): ${plu(dupC.length,'collection')}, ${plu(dupI.length,'model')}, ${skip?'left untouched.':'updated from the backup.'}`,
  'Nothing is deleted.'];
 if(!d.photos.length)L.push('This backup has no photos, so current photos stay as they are.');
 if(size>2e7)L.push(`Large file (${fmtB(size)}). This may take a moment.`);
 if(!await dlg({title:skip?'Skip duplicates?':'Merge backup?',msg:L.join('\n'),ok:skip?'Import new only':'Merge'}))return;
 const fin=new Map(cc.map(c=>[c.id,c]));useC.forEach(c=>fin.set(c.id,c));
 useC.forEach(c=>{if(c.parentId!==ROOT&&!fin.has(c.parentId))c.parentId=ROOT});
 useC.forEach(c=>{const seen=new Set([c.id]);for(let p=fin.get(c.parentId);p;p=fin.get(p.parentId)){if(seen.has(p.id)){c.parentId=ROOT;break}seen.add(p.id)}});
 useI.forEach(x=>{if(x.parentId!==ROOT&&!fin.has(x.parentId))x.parentId=ROOT});
 const cols=useC.map(x=>{const{icon,...r}=x;return typeof icon==='string'?{...r,icon:d2b(icon)}:r});
 const ph=photos.map(p=>({...p,blob:d2b(p.blob),thumb:p.thumb?d2b(p.thumb):undefined}));

PHASE &#8212; MULTI-VAULT HARDENING FIX (this revision)
- Issue 1 (critical): vault-scoped Replace no longer swaps the global vault list. A backup whose head carries scope:{type:'vault'} restores ONLY that vault: its vault record is added/updated, its old collections/models/photos/bin/points-mappings are cleared, then the backup's records are written. Every unrelated vault, its records and the recycling bin are untouched. Full backups (scope 'all' or old v1 files) keep the existing swap-all-vaults Replace.
- Issue 2 (critical): DB.delVault now includes models embedded in the vault's recycling-bin entries (bin.items[].id) in the item-ID set used to purge pointsMappings/unitConfigurations, so binned models cannot leave orphaned points data behind.
- Issue 3/12 (high): async vault-context hardening. buildReport and buildStats capture the vault context (VAULT/ROOT/STATUS/STW/pointsStatusRates/W terms) before their awaited reads and keep using it even if the user switches vault mid-read; the user's active vault is re-applied afterwards. The all-vaults report's per-vault context switch now also refreshes the W terminology. openMissing rescans if the vault changed while data was loading.
- Issue 4 (high): Check and repair validates recycling-bin ownership: bin.vaultId must be a known vault, and every item/collection embedded in a bin entry must carry the same vaultId as the bin. Unknown bin vaults move to the first vault; mismatched embedded records are stamped to the bin's vault. Backup import applies the same rules.
- Issue 5 (medium): the Data Only backup size estimate now includes the dependency-scoped points payload (unit configurations, mappings and only the profiles they reference) using the same scoping rules as the export.
- Issue 6 (high): settings are split. Global app preferences (theme, accent, motion, layout, quality, bin retention, points database link) only restore from a FULL backup; a vault-only restore applies just that vault's own vault record (name, statuses, terminology, per-vault sort/view/layout) and its top-level sort, never global preferences. Vault exports also carry the target vault's own top-level sort, not the active vault's.
- Issue 7 (medium): scanMissing only considers points mappings that belong to the active vault's own models; profiles remain shared/global records.
- Issue 8 (medium): deleting a points profile warns how many collections across how many vaults currently use it.
- Issue 9 (medium): Merge/Skip detects same-ID/different-vault records as ownership conflicts and imports them as fresh-ID copies (photos, points mappings and unit configurations follow the remap), reporting the count. Nothing silently changes vault.
- Issue 10 (medium): the restore journal (localStorage 'hv-restore') now records the stage reached (preparing, vaults-written, old-records-cleared, records-written, photos-written, points-complete) and still warns on the next start if a restore did not finish.
- Issue 11 (low): automatic backups now write an explicit "scope":{"type":"all"} in the backup head.
- No schema changes, no migration, no destructive cleanup: existing vaults, collections, models, photos, points profiles/mappings/configurations, recycling bin and settings are preserved. Old v1 and v2 backups import exactly as before.
- Known limitations: a vault-scoped Replace is write-then-clear-of-old rather than one transaction (the journal plus Check and repair cover an interruption, as with the full Replace); points profiles stay global by design, so a vault-only Replace upserts its profiles and never deletes profiles other vaults may share.

FINAL HARDENING PASS (this revision)
- Issue 1 (critical): replaceVaultFromFile now builds the "old item ids" set from BOTH the vault's live models AND the models embedded in its recycling-bin entries (bin.items[].id), so a binned model that is permanently removed by a vault-scoped Replace cannot leave orphaned pointsMappings/unitConfigurations behind. The same orphan rule was added to the full replaceFromFile: when the backup does not carry a points store, the post-prune sweep drops mappings/configurations whose item no longer exists. Profiles are never deleted globally.
- Issue 2 (high): recycling-bin ownership repair no longer stops at an unknown bin.vaultId. A safe target vault is chosen from the vaults the bin's own embedded records name (majority wins), falling back to the app's established rule (the first vault) only when no embedded record names a valid vault; the bin AND every embedded item/collection are then repaired to that same target together, so the entry always ends up internally consistent. No live records are touched and nothing is assigned to an unrelated vault when ownership can be determined.

- Existing points matching, unit configuration, Missing Information and points display systems are reused.

Database changes
- No new IndexedDB stores are required.
- Existing pointsProfiles, pointsMappings, unitConfigurations, collections, items and hobby status fields are reused.
- Import-summary dismissal state is stored in localStorage so existing IndexedDB user data is untouched.

Migration changes
- No database migration is required.
- Existing collections, models, photos, statistics/status data and points configuration remain intact.

Future extension points
- Historical MFM profile/version tracking can build on the existing profile version/importDate fields.
- New Recruit export can consume the stored unit mappings and generated configurations.
- Automatic profile updates can reuse the existing replace/import path and summary comparison.

NEXT PHASE:
Historical MFM tracking, New Recruit export and automatic profile updates.

Startup compatibility fix
- Points display loading is now non-blocking: an unavailable points store cannot prevent the Vault from rendering.

Latest display and interaction refinements
- Collection point totals include all nested sub-collections and are hidden when the total is zero or unavailable.
- Model cards show points in a compact in-card value when priced, and hide the value when zero or unavailable.
- Model detail points information now shows the legal models-per-unit size and how many additional models are needed for the next unit.
- Model-card Options buttons have been removed; the existing long-press gesture now opens the same edit/actions menu.

Phase 6: collection cards
- Collection-card Options (...) buttons have been removed; holding down a collection card for ~450ms opens the same edit/actions menu (identical menu, with haptic feedback on supported devices).
- Collection cards now show the total owned points (including all nested sub-collections) in the top-right corner, in the same compact style as model cards. The value is hidden when the total is zero or unavailable.
- Partial points totals: collection cards, collection subtitles and the Statistics page now sum only the models that have points data. Unpriced models are ignored instead of suppressing the whole total; totals show "&#8212;" only when nothing in scope is priced.
- Collection card subtitles no longer repeat the Points / Battle Ready / Completion text; cards show just "N Models &#183; N Units" with the points total kept in the top-right corner. Full points, battle-ready and completion figures remain on the Statistics page.

ADDITIONAL LOGIC FIXES AND DATA-INTEGRITY HARDENING (this revision)
- Issue 1 (critical): every permanent recycling-bin deletion purges points data. DB.binDrop and DB.binClear read the entries first, collect every model id embedded in bin.items[], and delete the associated pointsMappings and unitConfigurations in the SAME transaction &#8212; except ids that are live again (an undo restored the model first), so nothing legitimate is lost. All permanent paths (Delete forever, Empty bin, automatic expiry binPurge, retention set to Off, delete/undo rollbacks) funnel through these two helpers. Check and repair now also detects genuinely orphaned points records: a mapping or unit configuration is removed only when its model exists in neither the live store nor ANY valid bin entry; malformed records are reported and removed too.
- Issue 2 (critical): Merge/Skip conflict remapping is complete for points records. When an incoming model id is remapped (same id in a different vault), its pointsMappings.itemId moves AND the record key is regenerated with the existing pointsMapId(profileId,newItemId) helper; unitConfigurations.itemId moves AND the record key (the model id) is regenerated. Conflicted copies therefore stay discoverable and can never overwrite another model's configuration. Existing records are never touched.
- Issue 3 (critical): explicit variable-size unit selections are respected. The MFM model picker's chosen size is stored on the model (item.unitSelection {profileId, unitName, size}); "Change match" now asks for the unit size when the chosen unit is variable-sized (with an Automatic = smallest-legal option). getUnitConfiguration honours a legal, quantity-supported explicit selection (as many units of the chosen size as the quantity fills; the rest is spare) and only falls back to the automatic smallest-legal split when there is no valid selection. persistUnitConfiguration takes the explicit size, keeps a still-valid saved selection and drops a stale one; quantity changes rebuild predictably. confirmItemPoints now re-derives and re-persists the configuration and grants the confirmed flag only when at least one unit exists and every unit is priced; the panel shows the selected size and the confirm button toasts clearly when there is nothing valid to confirm.
- Issue 4 (medium): the MFM points-profile tip after creating a collection is now a ONE-TIME reminder (localStorage 'hv-mfm-tip-seen'), marked only when the dialog is acknowledged after a successful first collection creation.
- Issue 5 (high): the full-Replace orphan sweep for legacy backups without points stores builds its valid model set from live items UNION the models embedded in the restored recycling-bin entries, so a retained binned model keeps its mappings while genuinely removed models are cleaned up.
- Issue 6 (medium): manual ordering has a working reorder mechanism again. In Manual order the collection long-press menu gains Move up / Move down, which swap the collection with its neighbour among its own siblings (same parent, active vault), persist sequential order values for every sibling, survive restarts and never touch quantities, statuses, points or parents. Sub-collections order independently; other sort modes are unchanged and do not destroy the saved order.
- Issue 7 (low): the obsolete MFM reliability script blocks (window.MFMReliability, HV_MFM_RELIABILITY incl. its duplicate declarations, window.showImportLogs, the separate 'hvImportLogs' log store) were removed after confirming no active references; the active import flow keeps using window.MFM_IMPORT_LOGS and its own logging, validation, summaries and export.
- No schema changes, no migration, nothing destructive: existing vaults, collections, models, photos, points profiles/mappings/configurations, recycling bin and settings are untouched. Old v1 and v2 backups import exactly as before.

ADDITIONAL FULL LOGIC & DATA-INTEGRITY FIXES &#8212; PASS 2 (this revision)
- Issue 1 (critical): backup validation detects circular collection hierarchies &#8212; direct self-parenting (A&#8594;A), two-node (A&#8594;B&#8594;A) and longer chains, independently per vault &#8212; plus cross-vault parent relationships (a parent that exists but belongs to another vault). Both have one deterministic repair: the affected collection re-parents to its OWN vault's top level; the ancestry walk is depth-capped so a corrupt backup can never hang the check or the import, and the affected collection names are reported. Merge applies the same cross-vault rule at write time and its existing cycle repair is unchanged.
- Issue 2 (critical): Check and repair now fully audits the separate points stores. pointsMappings: itemId exists (live or legitimately retained in a recycling-bin entry), profileId exists, the mapping key follows the pm-<profile>-<item> convention, the mapped unit exists in the profile, and malformed records are reported. unitConfigurations: itemId exists, profile exists, unit exists in the profile, the configuration is structurally valid and every unit size is legal for that MFM unit. Repairs: provably unusable records (missing profile, unknown unit, malformed configuration) are deleted; broken keys are rebuilt deterministically from the record's own references; binned models' records are never touched; a record's vault is always its model's vault &#8212; nothing is re-attached to an arbitrary vault. The report states counts per category.
- Issue 3 (high): duplicate primary IDs inside one backup are detected for vaults, collections, models, recycling-bin entries, points profiles, points mappings and unit configurations. A duplicate in any of those stores BLOCKS the import (Replace and Merge/Skip) with a clear error naming the store and an example id &#8212; nothing is written and no record is silently chosen. Duplicate photo and bin-photo records are less critical: the first copy is kept and the rest are skipped, reported in the summary.
- Issue 4 (high): a dedicated points-integrity phase now runs BEFORE any write on Replace and Merge/Skip: points mappings and unit configurations whose model, profile or unit is missing from the backup (or, for merges, from the backup plus the existing database) are dropped before the restore starts, so a malformed points record can never fail an import halfway. Models retained inside restored recycling-bin entries count as valid references. The restore journal and atomicity mechanisms are unchanged.
- Issue 5 (high): removing a collection's points profile now reconciles the whole descendant branch: every descendant model that inherited the old profile has its stale active pointsProfileId cleared and the derived unit configurations that relied on the removed profile are deleted. The remembered mappings are deliberately kept (the profile still exists globally; Check and repair removes them only if the profile itself is deleted), other profiles, branches and vaults are untouched, and assigning a profile again repopulates everything through the normal reconciliation. Moving a collection between parents now refreshes every descendant's inherited profile pointer (no dialogs), and the existing per-model move reconciliation is unchanged.
- Issue 6 (medium): online MFM requests are centralised in mfmFetchText with a per-attempt AbortController, a hard timeout (25s), exponential-backoff retries for network errors/timeouts/5xx/429, immediate failure for other 4xx and an offline pre-check. New: every in-flight request is registered, and closing the Points Profiles sheet or cancelling the faction modal aborts all pending downloads cleanly (marked final, never retried) &#8212; no partial profile writes, busy states reset through the existing runners, retry stays available. Manual YAML import remains fully offline and untouched.
- Issue 7 (medium): legacy vault normalisation no longer reads a MISSING features.points flag as "off". Before the per-vault Points switch existed every vault had points, so a legacy vault record without the field now normalises to points ON; only an explicitly stored false disables it. Current vaults that intentionally disabled Points are unaffected.
- Issue 8 (medium): every hierarchy traversal is now defensively cycle-proof &#8212; pathOf, the Move picker path labels, the item location label, the Statistics collection path/breadcrumb walks and the biggest-collections grouping all use a visited set plus a depth cap, so a corrupted database with a cycle can never freeze the UI; Check and repair (which already detects and repairs cycles) remains the safety net. The growth-set walks (scopeIds etc.) were audited and are already terminating.
- No schema changes, no migration, nothing destructive: existing vaults, collections, models, photos, points profiles/mappings/configurations, recycling bin and settings are preserved. Old v1 and v2 backups import exactly as before.

REMAINING HARDENING FIXES &#8212; PASS 3 (this revision)
- Fix 1 (points-store audit deepened): scanVault now builds one ownership map first (every live model and every model embedded in a recycling-bin entry -> {vault, live/binned}), so the audit distinguishes LIVE / BINNED / MISSING models and never treats a legitimately binned model's retained points history as orphaned. Each pointsMappings record is checked for: valid id and key convention (pm-<profile>-<item>), existing model (live or binned), existing profile, unit known in that profile, vault known, and payload/state shape (score a finite number, confirmed/skipped booleans when present). Each unitConfigurations record is checked for: id/key convention, model, profile, unit, configuration structure (positive finite sizes, legal for the MFM unit, total finite and <= 999, spareModels a non-negative integer, no NaN/Infinity). Malformed payloads are REPORTED ONLY and never auto-deleted; provably unusable records (missing profile, unknown unit, impossible configuration) keep the established safe deletion; broken keys are rebuilt deterministically; a cross-vault record follows its MODEL to the repaired vault &#8212; a record is never re-attributed independently. New: stale ACTIVE pointsProfileId pointers on live models (disagreeing with what the model's own collection chain inherits) are detected and deterministically recomputed. The report distinguishes repaired / warning / orphaned / cross-vault / malformed categories with counts.
- Fix 2 (strict backup points validation): sanitizeBackupPoints now runs as a proper pre-import phase: it FIRST validates the backup's own points profiles (payload structure); a malformed profile is dropped from the import so it can never replace a good stored profile, and is reported. It then validates every points mapping and unit configuration against the effective profile map (the database's existing valid profiles plus the backup's surviving profiles) for payload shape, model (live or retained in a restored bin entry), profile and unit &#8212; invalid records are removed from the import payload and their count is shown in the confirm dialog before ANY write on Replace and Merge/Skip. Duplicate-ID blocking and hierarchy-cycle detection (previous pass) run unchanged and earlier in the same pipeline: read -> parse -> structure -> duplicate IDs -> hierarchy -> profiles -> mappings/configurations.
- Fix 3 (collection profile removal reconciliation): verified complete from the previous pass and kept unchanged &#8212; removing a collection's points profile clears every descendant model's stale active pointsProfileId and deletes the derived unit configurations that relied on the removed profile (remembered mappings are kept deliberately), assigning a profile again repopulates through the normal reconciliation, and moving a collection between parents refreshes descendants' inherited pointers via syncDescendantProfiles. The new stale-pointer audit and repair (Fix 1) now also catches any residue the incremental paths could miss.
- Fix 4 (defensive hierarchy loops): every remaining growth-set walk (scopeIds, the fill/report/assign/bin-restore/syncDescendants/delCollection-descendant/expiry-scope expansions &#8212; 9 sites) is now round-capped as defence-in-depth, so even a corrupted database containing a cycle can never spin in hierarchy traversal; nodes behind a cycle simply stay out of the set and Check and repair (which detects and repairs cycles) remains the safety net. The ancestry walks were already visited-set + depth-capped in the previous pass and are unchanged.
- No schema changes, no migration, nothing destructive: existing vaults, collections, models, photos, points profiles/mappings/configurations, recycling bin and settings are preserved. Old v1 and v2 backups import exactly as before.

RELIABILITY PATCH &#8212; PASS 4 (this revision)
- Issue 1 (Skip Duplicates can lose points data): in Merge/Skip the ownership-conflict remap (fresh-ID copies) is now applied to pointsMappings and unitConfigurations BEFORE the skip-duplicates filter, so the REGENERATED record key decides whether a record is new &#8212; a copy keeps its points data even when the original model (still existing elsewhere under the old key) already carries a record. Non-conflicting imports behave exactly as before; no duplicate records are created.
- Issue 2 (explicit unit size not bound to profile): explicitSizeFor now validates the stored profileId against the profile being priced; a size picked under Profile A never carries into Profile B (automatic configuration is used instead), while legacy selections without a profileId keep working. The profile is threaded through getUnitConfiguration, priceUnitConfiguration, getSpareModels, calculateOwnedUnits/Points, persistUnitConfiguration, itemPointsInfo, pointsProfileMapData, confirmItemPoints and the points panel; persistUnitConfiguration also drops a selection made under a different profile.
- Issue 3 (removing a parent profile could clear valid child assignments): the removal walk now stops at any sub-collection that carries its OWN pointsProfileId &#8212; even the SAME profile &#8212; so an explicitly-assigned child and its whole branch (pointers, configurations) are untouched; only branches that truly INHERITED the removed profile are cleared, and the affected branch's pointers are then recomputed via syncDescendantProfiles (a higher ancestor's profile is inherited instead of leaving nulls).
- Issue 4 (models needed for next unit with explicit size): modelsNeededForNextUnit uses the CHOSEN size only when an explicit selection exists (15 owned with size 10 selected needs 5, not 0); automatic mode keeps the original smallest-fitting-size logic and spare calculations are unchanged.
- Issue 5 (Check & Repair missed missing active pointers): the stale-pointer audit no longer skips models with a NULL pointsProfileId &#8212; null-to-inherited-profile cases are detected and repaired alongside wrong pointers; models in vaults with Points turned off are skipped (their null pointers are by design), and valid pointers remain untouched.
- Issue 6 (live item + bin duplicate id collision): Check & Repair reports bin records whose id is live again (report-only, nothing changed automatically), and bin restore now imports such records as fresh-ID copies &#8212; parent links, photos and points records follow the remap completely with regenerated keys, the live record is never overwritten, and no mappings or configurations are lost; the restore toast mentions the copy.
- No schema changes, no migration, no destructive cleanup, no MFM valuation changes (first-unit pricing and smallest-legal auto-splitting are untouched): existing vaults, collections, models, photos, points profiles/mappings/configurations, unit selections, recycling bin and settings are preserved, and old v1/v2 backups import exactly as before.

'use strict';
/* ---------- global press flash ----------
   One delegated listener gives every interactive control the identical click animation:
   the accent flash is applied on pointerdown via .hv-press and held for 400ms, then the
   class is removed so the colour fades back over the standard 220ms transition.
   Disabled controls and inert (blocked-behind-overlay) contexts are skipped. */
const PRESS_SEL='.btn,.ib,.qty button,.tile button,.chip,.more,.res-row,#crumbs button,.ddi,.lnk,.tundo,.cwatch,.swt,.vwx,.vwn,.vwr,button.strow,.card,.gh,.crow,.srow,#add,button.mrow,.is-sec summary,.vpick,.vmore,.top h1';
document.addEventListener('pointerdown',e=>{const t=e.target&&e.target.closest?e.target.closest(PRESS_SEL):null;
 if(!t||t.matches(':disabled')||t.closest('[inert]'))return;
 t.classList.add('hv-press');clearTimeout(t._pt);t._pt=setTimeout(()=>{t.classList.remove('hv-press');t._pt=0},400)},{capture:true});
/* ---------- helpers & icons ---------- */
let ROOT='root';const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

const byName=(a,b)=>a.name.localeCompare(b.name);
const fmtB=b=>b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const fieldText=r=>{if(!r||!r.fields)return'';const v=vEff(r);if(!v||!Array.isArray(v.fields))return'';
 return v.fields.map(f=>{const x=r.fields[f.key];if(x===undefined||x===null||x==='')return'';return f.type==='bool'?f.label+' '+(x?'yes':'no'):String(x)}).join(' ')};
const matchQ=(r,q)=>{const h=(r.name+' '+(r.category||'')+' '+(r.notes||'')+' '+fieldText(r)+' '+(r.notes!=null||r.qty!==undefined||r.status!==undefined||r.split!==undefined||r.createdAt!==undefined?segs(r).map(s=>stLab(s.status)).join(' '):'')).toLowerCase();return q.split(/\s+/).filter(Boolean).every(t=>h.includes(t))};

const M=(()=>{const RMQ=matchMedia('(prefers-reduced-motion: reduce)'),RM={get matches(){return RMQ.matches||document.documentElement.dataset.motion==='off'}};

const out=e=>run(e,[{opacity:1,transform:'none'},{opacity:0,transform:`scale(${RM.matches?1:.8})`}],'med',{fill:'forwards'});

/* ---------- cross-vault move & copy (models and whole collections) ----------
   One engine serves the long-press "Send to another vault\u2026" menu and "Split off a new vault".
   A MOVE keeps every id (records, photos, points mappings and unit configurations are keyed by them,
   so nothing has to be rewritten) and only re-stamps vaultId + the top-level parentId; a COPY clones
   records/photos/points records under fresh ids, keys regenerated with the established helpers.
   Statuses remap to the destination vault's own statuses (unknown keys -> its first status, splits
   collapse) exactly like a cross-vault bin restore; custom-field values travel untouched and stay
   hidden when the destination vault lacks the field \u2014 the same rule a merge import follows. */
async function xferToVault(kind,recId,tvId,copy){
 const tv=VAULTS.find(v=>v.id===tvId);if(!tv)return false;
 const[C0,I0]=await Promise.all([DB.all('collections'),DB.all('items')]);
 const src=(VAULT&&VAULT.id)||V0,vid=r=>(r&&(r.vaultId||V0))||src;
 let cols=[],items=[];
 if(kind==='i'){const r=I0.find(x=>x.id===recId);if(!r||vid(r)!==src)return false;items=[r]}
 else{const cs=new Set([recId]),mine=C0.filter(c=>vid(c)===src);
  for(let more=true,rd=0;more&&rd<=5000;rd++){more=false;mine.forEach(c=>{if(!cs.has(c.id)&&cs.has(c.parentId)){cs.add(c.id);more=true}})}
  cols=mine.filter(c=>cs.has(c.id));if(!cols.length)return false;
  items=I0.filter(i=>vid(i)===src&&cs.has(i.parentId))}
 const top=kind==='i'?items[0]:cols.find(c=>c.id===recId);
 /* cross-vault duplicate names: the destination's top level is checked like okName at home;
    the user can keep the name, rename, or cancel the whole transfer */
 let name=String(top.name||'');
 const taken=await DB.by(kind==='c'?'collections':'items','parentId',tv.rootId);
 if(taken.some(x=>String(x.name).trim().toLowerCase()===name.trim().toLowerCase())){
  const sug=copy?name+' copy':name;
  const r=await dlg({title:'Name already used',msg:`\u201c${name}\u201d already exists at the top level of ${tv.name}. Keep the name, or enter a new one.`,input:sug,ph:sug,ok:'Save name',again:'Keep name'});
  if(!r)return false;
  if(typeof r==='string'){const n=r.trim().slice(0,80);if(!n)return false;name=n}}
 /* status remap against the destination vault's own statuses (the bin-restore rules) */
 const keys=new Set(tv.statuses.map(x=>x.key)),f0=tv.statuses[0].key;
 const remapSt=r=>{if(r.status!==undefined&&!keys.has(r.status))r.status=f0;
  if(r.split&&typeof r.split==='object'){const m={};for(const[k,q]of Object.entries(r.split)){const t=keys.has(k)?k:f0;m[t]=(m[t]||0)+(+q||0)}
   const u=Object.keys(m);if(u.length<=1){delete r.split;if(u.length)r.status=u[0]}else r.split=m}};
 if(!copy){ /* move: keep ids, re-stamp vault + destination top level, reconcile points on arrival */
  const bf={c:structuredClone(kind==='c'?cols:[]),i:structuredClone(items)};
  top.parentId=tv.rootId;top.name=name;
  if(kind==='c')cols.forEach(c=>c.vaultId=tv.id);
  items.forEach(r=>{r.vaultId=tv.id;remapSt(r)});
  await DB.putMany(kind==='c'?cols:[],items,[]);
  if(tv.features.points){try{
   if(kind==='c')await syncDescendantProfiles(recId);
   else await reconcileItemPoints(top)}catch(_){}}
  return{moved:true,copy:false,name,vname:tv.name,undo:async()=>{await DB.putMany(bf.c,bf.i,[])}}}
 /* copy: fresh ids everywhere; photos and points records follow with regenerated keys */
 const allIds=new Set([...C0.map(c=>c.id),...I0.map(i=>i.id),...(await DB.photoKeys())]);
 const nid=p=>{let k;do{k=p+'-xv'+Math.random().toString(36).slice(2,8)}while(allIds.has(k));allIds.add(k);return k};
 const idMap=new Map();
 if(kind==='c')cols.forEach(c=>idMap.set(c.id,nid(c.id)));
 items.forEach(i=>idMap.set(i.id,nid(i.id)));
 const nCols=kind==='c'?cols.map(c=>{const n=structuredClone(c);n.id=idMap.get(c.id);if(c.id===recId)n.parentId=tv.rootId;else if(idMap.has(n.parentId))n.parentId=idMap.get(n.parentId);n.vaultId=tv.id;return n}):[];
 const nItems=items.map(r=>{const n=structuredClone(r);n.id=idMap.get(r.id);if(kind==='c'){if(idMap.has(n.parentId))n.parentId=idMap.get(n.parentId)}else n.parentId=tv.rootId;n.vaultId=tv.id;remapSt(n);return n});
 (kind==='c'?nCols:nItems)[kind==='c'?nCols.findIndex(c=>c.id===idMap.get(recId)):0].name=name;
 const photos=(await Promise.all(items.map(i=>DB.photos(i.id)))).flat()
  .map(p=>{const n=structuredClone(p);n.id=nid(p.id);n.itemId=idMap.get(p.itemId);return n});
 const ptIds={pointsMappings:[],unitConfigurations:[]}; /* copied points records are cleaned up if the copy is undone (delItem/delCollection do not touch them) */
 for(const st of['pointsMappings','unitConfigurations']){
  const recs=(await DB.all(st)).filter(r=>r&&idMap.has(r.itemId));
  const out=recs.map(r=>{const ni=idMap.get(r.itemId);
   return{...r,itemId:ni,id:st==='unitConfigurations'?ni:(r.profileId!=null?pointsMapId(String(r.profileId),ni):nid(r.id))}});
  if(out.length){out.forEach(r=>ptIds[st].push(r.id));await DB.putList(st,out)}}
 await DB.putMany(nCols,nItems,photos);
 if(tv.features.points){try{
  if(kind==='c')await syncDescendantProfiles(idMap.get(recId));
  else await reconcileItemPoints(nItems.find(i=>i.id===idMap.get(recId)))}catch(_){}}
 return{moved:false,copy:true,name,vname:tv.name,undo:async()=>{
  if(kind==='c')await DB.delCollection(idMap.get(recId));else await DB.delItem(idMap.get(recId));
  for(const st of['pointsMappings','unitConfigurations']){try{if(ptIds[st].length)await DB.delKeys(st,ptIds[st])}catch(_){}}}}}

async function xferBatch(kind,ids,tvId,copy){
 if(!VAULTS.some(v=>v.id===tvId))return null;
 const recs=await DB.all(kind==='c'?'collections':'items'),nm=id=>((recs.find(r=>r.id===id)||{}).name)||'(unnamed)';
 let todo=[...ids],failed=[];const ok=[],undos=[];
 while(todo.length){const fail=[];
  for(const id of todo){let why='';try{const r=await xferToVault(kind,id,tvId,copy);if(r){ok.push(r);r.undo&&undos.push(r.undo);continue}why='skipped (name conflict cancelled, or no longer found)'}catch(e){why=(e&&e.message)||'error'}fail.push({id,name:nm(id),why})}
  failed=fail;if(!fail.length)break;

/* in-memory only: classifies every model in scope without touching the database */
async function buildImportPlan(parsed,existingId,newCollectionId){
  const all=await DB.all('pointsProfiles');
  const old=(existingId&&all.find(p=>p.id===existingId))||all.find(p=>p.slug===parsed.slug)||null;
  const profile={id:old?old.id:ppId(),units:parsed.units};
  const[cols,items,maps]=await Promise.all([DB.all('collections'),DB.all('items'),DB.all('pointsMappings')]);
  const roots=old?cols.filter(c=>c.pointsProfileId===old.id).map(c=>c.id):(newCollectionId?[newCollectionId]:[]);
  const ids=new Set(roots);
  /* sub-collections that carry a different profile of their own are not part of this import */
  for(let more=true,rd=0;more&&rd<=5000;rd++){more=false;cols.forEach(c=>{if(!ids.has(c.id)&&ids.has(c.parentId)&&(!c.pointsProfileId||c.pointsProfileId===profile.id)){ids.add(c.id);more=true}})}
  const pm=new Map(maps.filter(m=>m.profileId===profile.id).map(m=>[m.itemId,m]));
  const rows=[];
  for(const item of items.filter(i=>ids.has(i.parentId)&&pointsOnFor(i.vaultId))){ /* stage 4: import plans only touch points vaults */
    const m=pm.get(item.id);
    if(m&&m.skipped){rows.push({item,state:'skipped'});continue}
    const kept=findUnitByMapping(profile,m);
    if(kept){rows.push({item,state:'kept',unit:kept,mapping:m});continue}
    const c=pointsCandidates(item,profile);
    if((c.type==='exact'||c.type==='alias')&&c.matches.length===1){rows.push({item,state:'exact',unit:c.matches[0].u,method:c.type});continue}
    const sug=c.type==='fuzzy'?c.matches.filter(x=>x.score>=POINTS_FUZZY_MIN).slice(0,POINTS_SUGGEST_MAX):c.matches.slice(0,POINTS_SUGGEST_MAX);
    rows.push({item,state:'unmatched',suggestions:sug});
  }
  rows.sort((a,b)=>String(a.item.name||'').localeCompare(String(b.item.name||'')));
  return{old,replaced:!!old,parsed,profile,rows,newCollectionId:newCollectionId||null};
}

/* the only place the import writes: profile, collection assignment, mappings, renames and unit configurations */
async function commitImportPlanCore(plan){
  const saved=await savePointsProfile(plan.parsed,plan.old?plan.old.id:null,plan.profile.id),profile=saved.record;
  if(!plan.old&&plan.newCollectionId){const c=await DB.get('collections',plan.newCollectionId);if(c){c.pointsProfileId=profile.id;await DB.put('collections',c)}}
  let renameSkipped=0;
  for(const r of plan.rows){
    const item=r.item;
    if(r.state==='skipped')continue;
    if(r.state==='unmatched'){
      if(!r.choice)continue;
      if(r.choice.skip){await savePointSkip(profile,item);item.pointsProfileId=profile.id;await DB.put('items',item);continue}
    }
    const unit=r.state==='unmatched'?r.choice.unit:r.unit,variable=isVariableSizeUnit(unit);
    if(r.state==='kept'){const m=r.mapping;if(m.variable!==variable)await savePointMapping(profile,item,unit,m.method,m.score,!variable)}
    else if(r.state==='exact')await savePointMapping(profile,item,unit,r.method,1,!variable);
    else{await savePointMapping(profile,item,unit,r.choice.method,r.choice.score,!variable);
      if(r.rename&&!await renameItemToUnit(item,unit))renameSkipped++}
    item.pointsProfileId=profile.id;await DB.put('items',item);
    await persistUnitConfiguration(item,profile,unit);
  }
  if(renameSkipped)toast(`${renameSkipped} model${renameSkipped===1?'':'s'} kept the current name`);
  return{record:profile,replaced:saved.replaced,previous:saved.previous};
}

async function chooseFuzzyUnit(item,profile,candidates){
  const usable=candidates.filter(x=>x.score>=POINTS_FUZZY_MIN).slice(0,4);
  if(!usable.length)return null;
  const choices=usable.map(x=>({label:`${x.u.name} (${Math.round(x.score*100)}% match)`,value:String(x.index)}));
  const pick=await dlg({title:'Confirm unit match',msg:`\u201c${item.name}\u201d does not exactly match a profile unit. Choose the correct unit once; Hobby Vault will remember this choice for this model and profile.`,choices});
  if(pick==null)return null;
  return usable[Number(pick)]||null;
}
function sameCfg(a,b){

async function reconcileItemPoints(item,opts={}){

  if(mapping&&mapping.skipped){item.pointsProfileId=profile.id;await DB.put('items',item);return{profile,mapping,unit:null,cfg:[],spare:sq0(item)}}

    else if(c.type==='alias'&&c.matches.length===1){unit=c.matches[0].u;mapping=await savePointMapping(profile,item,unit,'alias',1,!isVariableSizeUnit(unit))}

/* confirmation is only granted for a configuration that is actually valid and persisted: the saved
   selection is re-derived, the configuration is re-written, and every unit must be priced */
async function confirmItemPoints(item,info){

function modelsNeededForNextUnit(item,unit,profile){
  const sizes=unitSizeOptions(unit);
  if(!sizes.length)return null;
  const spare=getSpareModels(item,unit,profile);
  /* Fix (explicit size): with an explicit unit-size selection the NEXT unit is another unit of the
     CHOSEN size only \u2014 alternate legal sizes are ignored (15 owned with size 10 selected needs 5,
     not 0). Automatic mode keeps the original smallest-fitting-size logic */
  const ex=explicitSizeFor(item,unit,profile);
  if(ex)return{target:ex,needed:Math.max(0,ex-spare)};
  const target=sizes.find(n=>n>=spare&&n>0)||sizes[0];
  return{target,needed:Math.max(0,target-spare)};
}

  const v=live();if(v&&v.isConnected)await fill(v,{quiet:1,keep:1});

/* ---------- Online profile sources (additional to manual YAML import, never a replacement) ----------
   Source order: 1) MFM website  2) GitHub YAML snapshot  3) manual "Import YAML" (always available).
   Every downloaded profile is converted into the exact structure parseMfmYaml() returns, then goes through the
   same matching / rename / mapping / summary pipeline as a manual import. Nothing is written until the user confirms. */

/* last successful download per source, used when the network or the page layout fails */

/* ---- comparison + confirmed import of one downloaded profile ---- */
const mfmUnitSig=us=>(Array.isArray(us)?us:[]).map(u=>pointsNorm(u&&u.name)).sort().join('|');
async function mfmDiff(parsed,existingId){
  const all=await DB.all('pointsProfiles'),old=(existingId&&all.find(p=>p.id===existingId))||all.find(p=>p.slug===parsed.slug)||null,meta=parsed.sourceMeta||{};let carried=0;
  /* Legends units only exist in the client-rendered page, so a website download cannot see them: keep the ones already in the stored profile */
  if(old&&meta.sourceType==='mfm-web'){const have=new Set(parsed.units.map(u=>pointsNorm(u.name)));
    (old.units||[]).forEach(u=>{if(u&&u.legends&&!have.has(pointsNorm(u.name))){parsed.units.push(u);have.add(pointsNorm(u.name));carried++}})}
  const changes=old?profilePointChanges(old,{units:parsed.units}):[];
  const same=!!old&&String(old.version)===String(parsed.version)&&!changes.length&&mfmUnitSig(old.units)===mfmUnitSig(parsed.units);
  return{old,carried,changes,same};
}
/* never saves unless download + parse already succeeded and, for an existing profile, the user confirms the replacement */
async function mfmApply(parsed,o={}){
  const{old,carried,changes,same}=await mfmDiff(parsed,o.existingId);
  if(same)return{status:'same',note:'Already up to date'};
  const val=mfmValidate(parsed,await DB.all('pointsProfiles'),o.existingId),vtxt=mfmValText(parsed,val);
  if(val.errors.length){mfmLog('error',`Blocked ${parsed.name}: ${val.errors.join('; ')}`);return{status:'fail',note:val.errors[0]}}
  if(!old&&!o.confirmed&&(val.warnings.length||parsed.fromCache)&&!await dlg({title:'Import validation',msg:vtxt,ok:'Continue'}))return{status:'skip',note:'Cancelled \u2014 nothing saved'};
  if(old&&!o.confirmed){
    const n=changes.length,msg=`${parsed.name}: version ${old.version||'unknown'} \u2192 ${parsed.version}\n${n} unit point change${n===1?'':'s'}.`+(carried?`\n${carried} Legends unit${carried===1?'':'s'} kept from the current profile (the website does not provide them).`:'')+'\nYour model mappings are kept.';
    if(!await dlg({title:'Replace MFM points profile?',msg:msg+'\n\n'+vtxt,ok:'Replace'}))return{status:'skip',note:'Not replaced'};
  }
  const before=await snapshotItemPoints();
  const colId=old?null:(o.collectionId||await chooseProfileCollection(`${parsed.name} MFM`));
  const plan=await buildImportPlan(parsed,old?old.id:null,colId);
  if(plan.rows.some(r=>r.state==='unmatched')&&!await showMatchingModal(plan))return{status:'skip',note:'Cancelled \u2014 nothing saved'};
  const r=await commitImportPlan(plan);
  const v=live();if(v&&v.isConnected)await fill(v,{quiet:1,keep:1});
  setRefresh&&setRefresh();
  if(o.summary!==false)await showImportSummary(await prepareImportSummary(r.previous,r.record,r.replaced),{before,after:await snapshotItemPoints()});
  return{status:'ok',note:r.replaced?'Updated':'Imported'};
}
/* ---- batch runner: download every job, offer GitHub YAML for website failures, then import one by one ---- */
async function mfmRunBatch(jobs,title,opt={}){
  const ui=mfmProgress(title,jobs.map(j=>j.f.name));jobs.forEach((j,i)=>ui.set(i,'wait','Waiting'));
  try{
    for(let i=0;i<jobs.length;i++){const j=jobs[i];ui.set(i,'work','Downloading\u2026');
      try{j.parsed=await mfmDownloadFaction(j.f,j.via);j.err=null;ui.set(i,'dl',j.parsed.fromCache?'Offline: using saved copy':'Downloaded')}
      catch(e){console.warn('Faction download failed',j.f.slug,e);j.err=e;ui.set(i,'fail','Unable to download faction profile.')}}
    const bad=jobs.map((j,i)=>({j,i})).filter(x=>x.j.err&&x.j.via==='web');
    if(bad.length&&await dlg({title:'Website import unavailable',msg:'Website import unavailable.\nWould you like to download from GitHub instead?',ok:'Use GitHub download'})){
      for(const{j,i}of bad){ui.set(i,'work','Downloading YAML\u2026');
        try{j.parsed=await mfmDownloadFaction(j.f,'github');j.via='github';j.err=null;ui.set(i,'dl','Downloaded (GitHub)')}
        catch(e){console.warn(e);ui.set(i,'fail','Unable to download faction profile.')}}}
    let ready=jobs.map((j,i)=>({j,i})).filter(x=>x.j.parsed&&!x.j.err),confirmed=false;
    if(opt.bulk&&ready.length){
      const todo=[],lines=[];
      for(const x of ready){const d=await mfmDiff(x.j.parsed,x.j.existing?x.j.existing.id:null);
        if(d.same){ui.set(x.i,'same','Already up to date');continue}
        todo.push(x);lines.push(`${x.j.parsed.name}: v${d.old?d.old.version:'?'} \u2192 v${x.j.parsed.version} (${d.changes.length} point change${d.changes.length===1?'':'s'})`)}
      ready=[];
      if(todo.length){
        if(await dlg({title:'Replace these profiles?',msg:lines.join('\n')+'\n\nYour model mappings are kept.',ok:'Replace all'})){ready=todo;confirmed=true}
        else todo.forEach(x=>ui.set(x.i,'skip','Not replaced'));
      }
    }
    for(const x of ready){ui.set(x.i,'work','Importing\u2026');
      try{const r=await mfmApply(x.j.parsed,{existingId:x.j.existing?x.j.existing.id:null,collectionId:x.j.collectionId,confirmed,summary:!opt.bulk});ui.set(x.i,r.status,r.note)}
      catch(e){console.warn(e);ui.set(x.i,'fail',e&&e.message||'Import failed')}}
  }finally{ui.finish('Completed')}
}

async function mfmChooseAndDownload(found,opt={}){

  if(opt.matchedFirst&&!found.factions.some(f=>f.match))toast('No collection names matched a faction \u2014 choose manually');
  const existing=new Map(profiles.map(p=>[p.slug,p])),src=found.via==='web'?'MFM website':'GitHub repository';

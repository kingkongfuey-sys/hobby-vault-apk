/* ---------- DB layer ---------- */
const DB=(()=>{let db;
const R=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const T=(s,m='readonly')=>db.transaction(s,m);
const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Transaction aborted'))});
const open=()=>new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('IndexedDB is not available'));
 const r=indexedDB.open('hobby-vault',1);
 r.onupgradeneeded=()=>{const d=r.result;
  d.createObjectStore('collections',{keyPath:'id'}).createIndex('parentId','parentId');
  d.createObjectStore('items',{keyPath:'id'}).createIndex('parentId','parentId');
  d.createObjectStore('photos',{keyPath:'id'}).createIndex('itemId','itemId')};
 r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('Database is blocked by another tab'))});
const get=(s,id)=>R(T(s).objectStore(s).get(id));
const put=async(s,o)=>{const t=T(s,'readwrite');t.objectStore(s).put(o);await done(t);return o};
const by=(s,ix,k)=>R(T(s).objectStore(s).index(ix).getAll(IDBKeyRange.only(k)));
const count=(s,k)=>R(T(s).objectStore(s).index('parentId').count(IDBKeyRange.only(k)));
const photos=async id=>(await by('photos','itemId',id)).sort((a,b)=>a.sortOrder-b.sortOrder);
const delPhoto=async id=>{const t=T('photos','readwrite');t.objectStore('photos').delete(id);await done(t)};
const putPhotos=async list=>{const t=T('photos','readwrite');list.forEach(p=>t.objectStore('photos').put(p));await done(t)};
const wipe=async(cols,items)=>{const t=T(['collections','items','photos'],'readwrite');
 const c=t.objectStore('collections'),i=t.objectStore('items'),p=t.objectStore('photos'),ix=p.index('itemId');
 cols.forEach(id=>c.delete(id));
 for(const id of items){i.delete(id);(await R(ix.getAllKeys(IDBKeyRange.only(id)))).forEach(k=>p.delete(k))}
 await done(t)};
const photoCounts=()=>new Promise((ok,no)=>{const m=new Map(),r=T('photos').objectStore('photos').index('itemId').openKeyCursor();
 r.onsuccess=()=>{const c=r.result;if(!c)return ok(m);m.set(c.key,(m.get(c.key)||0)+1);c.continue()};r.onerror=()=>no(r.error)});
const all=s=>R(T(s).objectStore(s).getAll());
const replaceAll=async d=>{const t=T(['collections','items','photos'],'readwrite');
 for(const n of ['collections','items','photos']){const o=t.objectStore(n);o.clear();(d[n]||[]).forEach(r=>o.put(r))}await done(t)};
const delItem=id=>wipe([],[id]);
const delCollection=async id=>{const cols=[id],items=[];
 for(let n=0;n<cols.length;n++){(await by('collections','parentId',cols[n])).forEach(c=>cols.push(c.id));
  (await by('items','parentId',cols[n])).forEach(x=>items.push(x.id))}
 await wipe(cols,items)};
return{all,replaceAll,open,get,put,by,count,photoCounts,photos,delPhoto,putPhotos,delItem,delCollection}})();

/* ---------- motion system (tokens live in CSS) ---------- */
const M=(()=>{const RMQ=matchMedia('(prefers-reduced-motion: reduce)'),RM={get matches(){return RMQ.matches||document.documentElement.dataset.motion==='off'}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const px=n=>RM.matches?0:n;
const run=(e,kf,k='med',o={})=>e.animate(kf,{duration:parseFloat(css('--dur-'+k)),easing:css('--ease'),fill:'backwards',...o}).finished.catch(()=>{});
const enter=(e,delay=0)=>run(e,[{opacity:0,transform:`translateY(${px(8)}px)`},{opacity:1,transform:'none'}],'med',{delay});
const pop=e=>run(e,[{opacity:0,transform:`scale(${RM.matches?1:.85})`},{opacity:1,transform:'none'}],'slow');
const out=e=>run(e,[{opacity:1,transform:'none'},{opacity:0,transform:`scale(${RM.matches?1:.8})`}],'med',{fill:'forwards'});
const fade=(e,a,b,k='med',o={})=>run(e,[{opacity:a},{opacity:b}],k,o);
const stagger=list=>{const per=RM.matches?0:Math.min(25,240/Math.max(list.length,1));list.forEach((e,i)=>enter(e,i*per))}; // max ~240ms delay + 220ms = <500ms
const flip=(g,fn)=>{const first=new Map([...g.children].map(c=>[c,c.getBoundingClientRect()]));fn();
 if(RM.matches)return;[...g.children].forEach(c=>{const f=first.get(c);if(!f)return;const l=c.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
  if(dx||dy)run(c,[{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}])})};
return{run,px,enter,pop,out,fade,stagger,flip}})();

/* ---------- toast, errors, dialog ---------- */
function toast(m,err){const t=el('div','toast'+(err?' err':''));t.textContent=m;$('#toasts').append(t);
 M.run(t,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}]);

const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){console.error(e);toast(e&&e.message||'Something went wrong',true)}};

function dlg({title,msg,input,ok='OK',danger,choices}){return new Promise(res=>{

 d.innerHTML=`<h2>${esc(title)}</h2>${msg?`<p>${esc(msg)}</p>`:''}${input!=null?`<input maxlength="80" placeholder="Name" value="${esc(input)}">`:''}<div class="row${choices?'':' h'}"></div>`;
 const row=$('.row',d),inp=$('input',d);let fin=false;
 const close=async v=>{if(fin)return;fin=true;M.fade(bd,1,0,'med',{fill:'forwards'});
  await M.run(d,[{opacity:1,transform:'none'},{opacity:0,transform:`scale(.94) translateY(${M.px(8)}px)`}],'med',{fill:'forwards'});bd.remove();res(v)};
 const add=(l,v,c)=>{const b=el('button','btn '+c,esc(l));b.onclick=()=>close(v);row.append(b);return b};
 if(choices)choices.forEach(c=>{const b=add(c.label,c.value,'ghost'+(c.danger?' danger':''));
  if(c.pick)b.onclick=()=>{const f=el('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(f.files[0])close({file:f.files[0]})};f.click()}});

 if(!choices){const b=add(ok,true,danger?'danger':'');b.onclick=()=>{if(inp){const v=inp.value.trim();if(!v)return inp.focus();close(v)}else close(true)}}
 bd.onclick=e=>{if(e.target===bd)close(null)};
 bd.onkeydown=e=>{if(e.key==='Escape')close(null);if(e.key==='Enter'&&inp)$('.btn:last-child',row).click()};
 bd.append(d);document.body.append(bd);M.fade(bd,0,1);
 M.run(d,[{opacity:0,transform:`scale(.94) translateY(${M.px(8)}px)`},{opacity:1,transform:'none'}],'slow');

const SEL=new Set();

async function bulk(a){
 const v=live(),recs=(await DB.all('items')).filter(i=>SEL.has(i.id)),n=recs.length;
 if(!v||!n){clearSel();return}
 const word=`${n} model${n===1?'':'s'}`,cards=()=>[...v.querySelectorAll('.card.sel')],undo=()=>cards().forEach(c=>c.getAnimations().forEach(x=>x.cancel()));
 if(a==='st'){const k=await dlg({title:`Set status for ${word}`,choices:STATUS.map(([k,l])=>({label:l,value:k}))});if(!k)return;
  for(const r of recs){r.status=k;await DB.put('items',r)}
  toast(`Status set to ${stLab(k)}`);clearSel();await fill(v,{quiet:1});return}
 if(a==='mv'){const cols=await DB.all('collections'),map=new Map(cols.map(c=>[c.id,c])),nm=c=>{const p=[];for(let x=c;x;x=map.get(x.parentId))p.unshift(x.name);return p.join(' / ')};
  const same=recs.every(r=>r.parentId===recs[0].parentId)?recs[0].parentId:null;
  const choices=[{label:'Vault (top level)',value:ROOT},...cols.map(c=>({label:nm(c),value:c.id})).sort((x,y)=>x.label.localeCompare(y.label))].filter(c=>c.value!==same);
  const d=await dlg({title:`Move ${word} to`,choices});if(!d)return;
  await Promise.all(cards().map(c=>M.out(c)));
  try{for(const r of recs){r.parentId=d;await DB.put('items',r)}}catch(e){undo();throw e}
  toast(`Moved ${word}`);clearSel();await fill(v,{quiet:1});return}

  await Promise.all(cards().map(c=>M.out(c)));
  try{for(const r of recs)await DB.delItem(r.id)}catch(e){undo();throw e}
  toast(`Deleted ${word}`);clearSel();await fill(v,{quiet:1})}}

 ta.oninput=guard(async()=>{it.notes=ta.value;await DB.put('items',it)});
 $('.ren',sh).onclick=guard(async()=>{const n=await dlg({title:'Rename model',input:it.name,ok:'Save'});
  if(n){it.name=n;await DB.put('items',it);$('h2',sh).textContent=n;toast('Renamed')}});
 const layout=()=>{const note=$('.muted',grid);if(!ph.length){if(!note)grid.append(el('p','muted','No photos yet. Add some to see them here.'));return}
  note&&note.remove();ph.forEach((p,i)=>{const t=tiles.get(p.id);grid.append(t);$('.l',t).disabled=i===0;$('.r',t).disabled=i===ph.length-1})};
 const mk=p=>{const u=URL.createObjectURL(p.blob),t=el('div','tile');t._u=u;
  t.innerHTML=`<img alt="Model photo" src="${u}"><button class="x" aria-label="Delete photo">${ICON.x}</button><button class="mv l" aria-label="Move earlier">${ICON.prev}</button><button class="mv r" aria-label="Move later">${ICON.next}</button>`;
  const im=$('img',t);im.onload=()=>im.classList.add('on');im.onclick=()=>lightbox(u,im);
  $('.x',t).onclick=guard(async()=>{await M.out(t);
   try{await DB.delPhoto(p.id)}catch(e){t.getAnimations().forEach(a=>a.cancel());throw e}
   ph=ph.filter(q=>q.id!==p.id);tiles.delete(p.id);URL.revokeObjectURL(u);M.flip(grid,()=>{t.remove();layout()})});
  const move=d=>guard(async()=>{const i=ph.findIndex(q=>q.id===p.id),j=i+d;if(j<0||j>=ph.length)return;
   [ph[i],ph[j]]=[ph[j],ph[i]];ph.forEach((q,n)=>q.sortOrder=n);await DB.putPhotos(ph);M.flip(grid,layout)});
  $('.l',t).onclick=move(-1);$('.r',t).onclick=move(1);tiles.set(p.id,t);return t};
 ph.forEach(mk);layout();
 $('.add',sh).onclick=()=>file.click();
 file.onchange=guard(async()=>{const fs=[...file.files];file.value='';if(!fs.length)return;toast(`Adding ${fs.length} photo${fs.length>1?'s':''}`);let n=0;
  for(const f of fs){try{const img=await load(f),blob=await shrink(img,...pq()),thumb=await shrink(img,360,.75);
   const p={id:uid(),itemId:id,blob,thumb,sortOrder:ph.length?ph[ph.length-1].sortOrder+1:0};
   await DB.putPhotos([p]);ph.push(p);const t=mk(p);layout();M.pop(t);n++}catch(e){toast(e.message||'Could not add photo',true)}}
  if(n)toast(`Added ${n} photo${n>1?'s':''}`)});
 const close=guard(async()=>{await M.run(sh,[{transform:'none'},{transform:'translateY(100%)'}],'slow',{fill:'forwards'});
  tiles.forEach(t=>URL.revokeObjectURL(t._u));sh.remove();const v=live();v&&fill(v,{quiet:1})});
 $('.back',sh).onclick=close;$('.cog',sh).onclick=()=>openSettings();
 document.body.append(sh);M.run(sh,[{transform:'translateY(100%)'},{transform:'none'}],'slow')}

async function lightbox(src,thumb){const lb=el('div','lb'),bg=el('div','bg'),im=new Image();im.src=src;im.alt='Full-size photo';
 lb.append(bg,im);document.body.append(lb);M.fade(bg,0,1);try{await im.decode()}catch(e){}
 const from=r=>{const a=im.getBoundingClientRect();return{transform:`translate(${r.left+r.width/2-a.left-a.width/2}px,${r.top+r.height/2-a.top-a.height/2}px) scale(${r.width/a.width})`}};
 M.run(im,[from(thumb.getBoundingClientRect()),{transform:'none'}],'slow');
 lb.onclick=async()=>{lb.onclick=null;M.fade(bg,1,0,'med',{fill:'forwards'});
  await(thumb.isConnected?M.run(im,[{transform:'none'},from(thumb.getBoundingClientRect())],'med',{fill:'forwards'}):M.fade(im,1,0,'med',{fill:'forwards'}));lb.remove()}}

/* ---------- search everything ---------- */
async function openSearch(){if($('.sheet.srch'))return;
 const[cols,items]=await Promise.all([DB.all('collections'),DB.all('items')]),map=new Map(cols.map(c=>[c.id,c]));
 const where=id=>{const p=[];for(let x=map.get(id);x;x=map.get(x.parentId))p.unshift(x.name);return p.join(' / ')||'Vault'};
 const all=[...cols.map(c=>({k:'c',r:c,w:where(c.parentId)})),...items.map(i=>({k:'i',r:i,w:where(i.parentId)}))];
 const sh=el('div','sheet srch');
 sh.innerHTML=`<div class="bar"><button class="ib back" aria-label="Close search">${ICON.down}</button><input type="search" class="q" placeholder="Search all collections and models" aria-label="Search everything"></div><div class="body res"></div>`;
 const q=$('.q',sh),box=$('.res',sh);let urls=[];const drop=()=>{urls.forEach(URL.revokeObjectURL);urls=[]};
 const close=async()=>{await M.run(sh,[{transform:'none'},{transform:'translateY(100%)'}],'slow',{fill:'forwards'});sh.remove();drop()};
 const draw=()=>{const t=q.value.trim().toLowerCase();drop();box.replaceChildren();if(!t)return box.append(el('p','muted','Type a name or category.'));
  const hits=all.filter(x=>(x.r.name+' '+(x.r.category||'')).toLowerCase().includes(t)).sort((a,b)=>byName(a.r,b.r)).slice(0,60);
  if(!hits.length)return box.append(el('p','muted','No matches.'));
  hits.forEach(x=>{const b=el('button','res-row',`<span class="rk">${x.k==='c'?ICON.folder:ICON.cube}</span><span><b>${esc(x.r.name)}</b><small>${esc(x.w)}</small></span>`);
   if(x.k==='c'&&x.r.icon instanceof Blob){const u=URL.createObjectURL(x.r.icon);urls.push(u);$('.rk',b).innerHTML=`<img alt="" src="${u}">`}
   b.onclick=guard(async()=>{await close();await go(x.k==='c'?x.r.id:x.r.parentId,1);if(x.k==='i')openItem(x.r.id)});box.append(b)})};
 q.oninput=draw;draw();$('.back',sh).onclick=close;
 document.body.append(sh);M.run(sh,[{transform:'translateY(100%)'},{transform:'none'}],'slow');q.focus()}

/* ---------- settings, backup ---------- */
function seg(box,opts,cur,fn,after){box.replaceChildren();opts.forEach(([k,l])=>{const b=el('button','chip'+(k===cur?' on':''),esc(l));b.onclick=()=>{fn(k);after()};box.append(b)})}
const b2d=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(b)});
const d2b=u=>{const[h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})};
const afterReplace=async()=>{document.querySelectorAll('.sheet:not(.set)').forEach(x=>x.remove());await go(ROOT,0)};
const plug=n=>(window.Capacitor&&window.Capacitor.Plugins||{})[n]||null;
const isNative=()=>{const c=window.Capacitor;return !!(c&&(c.isNativePlatform?c.isNativePlatform():c.getPlatform&&c.getPlatform()!=='web'))};
async function exportDB(){
 const stamp=new Date().toISOString(),file=`hobby-vault-${stamp.slice(0,10)}.json`;
 const[c,i,p]=await Promise.all([DB.all('collections'),DB.all('items'),DB.all('photos')]);
 const cols=[];for(const x of c)cols.push(x.icon instanceof Blob?{...x,icon:await b2d(x.icon)}:x);
 const photo=async x=>JSON.stringify({...x,blob:await b2d(x.blob),thumb:x.thumb?await b2d(x.thumb):null});
 const head=`{"app":"hobby-vault","version":1,"exported":${JSON.stringify(stamp)},"collections":${JSON.stringify(cols)},"items":${JSON.stringify(i)},"photos":[`;
 if(!isNative()){const parts=[head];for(let k=0;k<p.length;k++)parts.push((k?',':'')+await photo(p[k]));parts.push(']}');
  const a=el('a');a.href=URL.createObjectURL(new Blob(parts,{type:'application/json'}));a.download=file;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5e3);toast('Backup exported');return}
 /* Android/iOS app: a blob download link does nothing in a webview, so write the file natively and open the share sheet */
 const FS=plug('Filesystem'),SH=plug('Share');
 if(!FS||!SH)throw new Error('Export needs the Capacitor Filesystem and Share plugins (npm i @capacitor/filesystem @capacitor/share, then npx cap sync)');
 toast('Preparing backup…');
 const at={path:file,directory:'CACHE',encoding:'utf8'};
 await FS.writeFile({...at,data:head});
 let buf='';const flush=async()=>{if(buf){await FS.appendFile({...at,data:buf});buf=''}};
 for(let k=0;k<p.length;k++){buf+=(k?',':'')+await photo(p[k]);if(buf.length>3e6)await flush()}
 buf+=']}';await flush();
 const{uri}=await FS.getUri({path:file,directory:'CACHE'});
 try{await SH.share({title:'Hobby Vault backup',dialogTitle:'Save or send your backup',files:[uri]})}catch(e){if(!/cancel/i.test(String(e&&e.message||e)))throw e}
 toast('Backup ready')}

function openSettings(){if($('.sheet.set'))return;const sh=el('div','sheet set');
 sh.innerHTML=`<div class="bar"><button class="ib back" aria-label="Close settings">${ICON.down}</button><h2>Settings</h2></div><div class="body">
 <section><h3>Appearance</h3>
  <div class="srow r-theme" role="switch" tabindex="0"><div><b>Dark mode</b><small class="hint"></small></div><span class="sw"></span></div>
  <button class="btn ghost sm phone">Use my phone's setting</button>
  <div><b>Accent colour</b><div class="sws"></div></div>
  <div class="srow r-motion" role="switch" tabindex="0"><div><b>Animations</b><small>Turn off for instant screen changes</small></div><span class="sw"></span></div></section>
 <section><h3>Collections</h3><div><b>Default sort</b><div class="chips wrap sortc"></div></div><div><b>Default view</b><div class="chips wrap viewc"></div></div></section>
 <section><h3>Photos</h3><div><b>Photo quality</b><small class="muted" style="display:block">Applies to photos you add from now on</small><div class="chips wrap qc"></div></div></section>
 <section><h3>Your data</h3><p class="muted" style="margin:0">A backup is one file with every collection, model and photo.</p>
  <div class="tb"><button class="btn ghost exp">Export database</button><button class="btn ghost imp">Import database</button></div>
  <button class="btn danger del">Delete all data</button></section></div>`;
 const th=$('.r-theme',sh),mo=$('.r-motion',sh),sws=$('.sws',sh),phone=$('.phone',sh);
 const sync=()=>{const s=SET.get(),t=SET.theme();th.setAttribute('aria-checked',t==='dark');mo.setAttribute('aria-checked',s.motion);
  $('.hint',sh).textContent=s.theme?'Set by you':'Following your phone';phone.hidden=!s.theme;sws.replaceChildren();
  Object.entries(ACC).forEach(([k,a])=>{const b=el('button','swt');b.style.background=a[t][0];b.setAttribute('aria-label',k+' accent');b.setAttribute('aria-pressed',s.accent===k);
   b.onclick=()=>{SET.set('accent',k);sync()};sws.append(b)});
  seg($('.sortc',sh),[['az','A to Z'],['za','Z to A']],s.sort,k=>SET.set('sort',k),sync);
  seg($('.viewc',sh),[[false,'Grouped'],[true,'Flat list']],s.flat,k=>SET.set('flat',k),sync);
  seg($('.qc',sh),[['saver','Data saver'],['standard','Standard'],['high','High detail']],s.quality,k=>SET.set('quality',k),sync)};
 const tog=(r,f)=>{r.onclick=f;r.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();f()}}};
 tog(th,()=>{SET.set('theme',SET.theme()==='dark'?'light':'dark');sync()});
 tog(mo,()=>{SET.set('motion',!SET.get().motion);sync()});
 phone.onclick=()=>{SET.set('theme',null);sync()};sync();
 $('.exp',sh).onclick=guard(exportDB);
 const imp=el('input');imp.type='file';imp.accept='application/json,.json';
 imp.onchange=guard(async()=>{const f=imp.files[0];imp.value='';if(!f)return;let d;
  try{d=JSON.parse(await f.text())}catch(e){throw new Error('That file is not a valid backup')}
  if(d.app!=='hobby-vault'||![d.collections,d.items,d.photos].every(Array.isArray))throw new Error('That file is not a Hobby Vault backup');
  if(!await dlg({title:'Replace everything?',msg:`This deletes all current data and loads the backup: ${d.collections.length} collections, ${d.items.length} models, ${d.photos.length} photos.`,ok:'Replace',danger:true}))return;
  d.collections=d.collections.map(x=>{const{icon,...r}=x;return typeof icon==='string'?{...r,icon:d2b(icon)}:r});
  d.photos=d.photos.map(p=>({...p,blob:d2b(p.blob),thumb:p.thumb?d2b(p.thumb):undefined}));
  await DB.replaceAll(d);await afterReplace();toast('Backup imported')});
 $('.imp',sh).onclick=()=>imp.click();
 $('.del',sh).onclick=guard(async()=>{if(!await dlg({title:'Delete all data?',msg:'Every collection, model and photo will be permanently removed. Export a backup first if you may want them back.',ok:'Delete everything',danger:true}))return;
  await DB.replaceAll({});await afterReplace();toast('All data deleted')});
 $('.back',sh).onclick=async()=>{await M.run(sh,[{transform:'none'},{transform:'translateY(100%)'}],'slow',{fill:'forwards'});sh.remove()};
 document.body.append(sh);M.run(sh,[{transform:'translateY(100%)'},{transform:'none'}],'slow')}

/* ---------- back button (Android hardware/gesture back in Capacitor) ---------- */
function handleBack(){
 const lb=$('.lb');if(lb){lb.click();return true}
 const bd=$('.backdrop');if(bd){bd.click();return true}
 const sheets=[...document.querySelectorAll('.sheet')];
 if(sheets.length){const open=sheets.filter(x=>!x.dataset.closing);if(!open.length)return true;
  const top=open.find(x=>x.classList.contains('set'))||open[open.length-1],b=$('.back',top);
  if(b){top.dataset.closing='1';b.click();return true}}
 if(SEL.size){clearSel();return true}
 if(cur!==ROOT){const b=[...crumbs.querySelectorAll('button')];if(b.length>1){b[b.length-2].click();return true}}
 return false}
(()=>{const A=plug('App');if(!A||!A.addListener)return;let last=0;
 A.addListener('backButton',()=>{if(handleBack())return;const t=Date.now();if(t-last<2000){A.exitApp&&A.exitApp();return}last=t;toast('Press back again to exit')})})();

/* ---------- start ---------- */
(async()=>{try{await DB.open()}catch(e){stage.innerHTML=`<div class="empty"><h2>Storage unavailable</h2><p>${esc(e.message)}</p></div>`;toast(e.message,true);return}
 go(ROOT,0)})();
</script></body></html>

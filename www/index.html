<!--
IMPORT FLOW UPDATE (this revision)
- YAML import no longer saves first: parse -> exact pass -> matching modal -> save. Cancelling the modal saves nothing.
- Order of preference: existing mapping (target unit still exists) > exact/alias name > fuzzy SUGGESTION only (>= 0.75, never auto-assigned, never shown as 100%).
- Every model in scope must be matched or marked "No points" before Save import enables. "No points" is remembered (mapping.skipped) and not re-prompted.
- Rename support: matching modal chip, and a "Rename model to YAML name?" prompt after Choose unit / Change match / fuzzy pick. Model name and mapping are updated together.
- Unit splitting: always the smallest legal size, derived from current quantity; leftovers tracked as spareModels, never priced.
- Pricing: 2nd/3rd-unit tiers ignored (every unit uses the 1st-unit tier); add-on costs are not unit sizes. Unit value changes in the summary compare tier 1 only.
- Import-summary dismissal key now uses the import timestamp, so a second import on the same day still shows its summary.

UI TRIM (this revision)
- Collection cards are no longer draggable to reorder (the hold-to-open actions menu remains, via the standard long-press).
- Sort menu reduced to: Manual order, A to Z, Z to A, Highest quantity first (Newest, Oldest, Least finished and Most finished removed).
- Existing saved sorts that used a removed option fall back to A to Z; previously saved manual order is still honoured.

ONLINE PROFILE SOURCES (this revision)
- Points Profiles now has Discover MFM Factions, Download From GitHub YAML (reads the saved Points database link, default BSData repo), Update Profile (per card) and Update All Downloaded Profiles. They are extra sources only: Import YAML, Re-import, Delete, matching, rename, mapping, statistics and summaries are unchanged.
- Source order: MFM website, then the BSData GitHub YAML snapshot, then manual YAML. Downloads go through parseMfmYaml() and the existing match -> confirm -> save -> summary pipeline. Existing profiles are only replaced after a successful download and an explicit confirmation.
- Profiles now record sourceType ('yaml' | 'mfm-web' | 'github-yaml'), sourceUrl, factionName and lastUpdated. A profile's website link now survives re-imports.
- The website does not serve Legends units to plain requests; a website update keeps any Legends units already stored in the profile.

PROFILE WEBSITE LINKS (this revision)
- Each points profile card in the Points Profiles sheet now has a link row: type or paste a website address, it saves onto the profile record (on change/Enter), and an "Open" button takes you there in a new tab.
- "https://" is added automatically if omitted; only http/https addresses are accepted, invalid input is rejected with a toast and the link survives re-imports of the profile.

UNIFIED PRESS FEEDBACK (this revision)
- Every interactive control on every page now shares one identical click animation: a single global pointerdown listener adds the .hv-press class, the control flashes the chosen accent colour, the flash is held for 400ms (even after a quick tap), then fades back over the standard 220ms transition.
- Coverage extended to the previously-unstyled import-summary "Choose unit" rows (button.mrow) and the collapsible Import Summary section headers (details.is-sec summary); static (non-interactive) summary rows are excluded.
- All other controls (buttons, ghost/plain/danger buttons, icon buttons, chips, qty steppers, photo-tile buttons, collection/model cards, breadcrumbs, sort dropdown items, report rows, stats rows, settings rows, undo links, colour watches, theme swatches, image-viewer controls, match-modal chips, FAB) were audited and now use the same mechanism and timings.
- Disabled controls and contexts behind an inert overlay do not flash. Long-press menus, swipe gestures and photo drag-reorder are unaffected (class-only change).

PHASE 5 COMPLETE

Features added
- Statistics now includes Owned Points, Built Points, Primed Points, Painted Points and Complete Points using the existing hobby status data.
- Collection analytics now shows Owned Points, Battle Ready Points and Completion.
- YAML imports now produce a one-time Import Summary with matched/unmatched units and point changes.
- Points profile management now clearly supports Replace Profile, Delete Profile, Version and Import Date.
- Import summaries are stored as dismissed once acknowledged and are not replayed on later app opens.
- Existing points matching, unit configuration, Missing Information and points display systems are reused.

Database changes
- No new IndexedDB stores are required.
- Existing pointsProfiles, pointsMappings, unitConfigurations, collections, items and hobby status fields are reused.
- Import-summary dismissal state is stored in localStorage so existing IndexedDB user data is untouched.

Migration changes
- No database migration is required.
- Existing collections, models, photos, statistics/status data and points configuration remain intact.

Future extension points
- Historical MFM profile/version tracking can build on the existing profile version/importDate fields.
- New Recruit export can consume the stored unit mappings and generated configurations.
- Automatic profile updates can reuse the existing replace/import path and summary comparison.

NEXT PHASE:
Historical MFM tracking, New Recruit export and automatic profile updates.

Startup compatibility fix
- Points display loading is now non-blocking: an unavailable points store cannot prevent the Vault from rendering.

Latest display and interaction refinements
- Collection point totals include all nested sub-collections and are hidden when the total is zero or unavailable.
- Model cards show points in a compact in-card value when priced, and hide the value when zero or unavailable.
- Model detail points information now shows the legal models-per-unit size and how many additional models are needed for the next unit.
- Model-card Options buttons have been removed; the existing long-press gesture now opens the same edit/actions menu.

Phase 6: collection cards
- Collection-card Options (...) buttons have been removed; holding down a collection card for ~450ms opens the same edit/actions menu (identical menu, with haptic feedback on supported devices).
- Collection cards now show the total owned points (including all nested sub-collections) in the top-right corner, in the same compact style as model cards. The value is hidden when the total is zero or unavailable.
- Partial points totals: collection cards, collection subtitles and the Statistics page now sum only the models that have points data. Unpriced models are ignored instead of suppressing the whole total; totals show "—" only when nothing in scope is priced.
- Collection card subtitles no longer repeat the Points / Battle Ready / Completion text; cards show just "N Models · N Units" with the points total kept in the top-right corner. Full points, battle-ready and completion figures remain on the Statistics page.
-->

.pi-row b{font-weight:600}
.pi-total{margin-top:2px;padding:14px 0 12px;border-top:1px solid var(--line)!important;border-bottom:0}
.pi-total span{color:var(--tx);font-weight:600}
.pi-total b{font-size:var(--t-2xl);color:var(--ac)}
.pi-unit{min-height:30px;border:0;box-shadow:inset 0 0 0 1px var(--line)}
.pi-spare{padding:0 0 12px}
.item-points .pi-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0;padding:12px 16px;border-radius:var(--radius-card);background:var(--ac-wash);font-size:var(--t-sm);color:var(--mu)}
.item-points .pi-meta b{color:var(--tx);font-weight:600}
.item-points .pi-meta em{font-style:normal;font-size:var(--t-xs);padding:2px 8px;border-radius:var(--radius-pill);background:var(--s1)}
.item-points .pi-actions .btn{min-height:48px;border-radius:var(--radius-control)}

/* Slightly shorter filter chips while keeping their existing width, font size and spacing. */
.chip{min-height:40px}
.tools .chip{min-height:40px}
.match-modal .mm-opts .chip{min-height:40px}
.match-modal .mm-row>.chip{min-height:40px}

/* v7 model page title: smaller, up to two lines, centred against the buttons */
.bar h2.ttl{font-size:var(--t-lg);line-height:1.2;white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;min-width:0;max-height:2.4em}

/* v7 collapsible points panel */
.pi-info{cursor:pointer}
.pi-total{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pi-total span{display:inline-flex;align-items:center;gap:6px}
.pi-total span svg{width:18px;color:var(--mu);transition:transform var(--dur-med) var(--ease)}
.pi-total[aria-expanded=true] span svg{transform:rotate(180deg)}
.pi-collapsed .pi-row:not(.pi-total),.pi-collapsed .pi-spare,.pi-collapsed .pi-meta,.pi-collapsed .pi-actions{display:none!important}
.pi-collapsed .pi-total{border-top:0!important;padding:14px 0}

/* v7 centre the placeholder cube in its square (old margin pushed it off-centre) */
.ph.it>svg{margin:0}

.sheet.stats .sfilters{display:grid;gap:8px;margin:0 0 var(--sp-3)}.sheet.stats .sfilters:empty{display:none}

/* ===== v8 audit fixes ===== */
/* import footer: horizontal, opaque, not clipped by the generic .dlg .row rules */
.import-summary .dlg>.row{flex-direction:row;max-height:none;overflow:visible;background:var(--s1);box-shadow:0 -1px 0 var(--line)}
.import-summary .dlg>.row .btn{flex:1}
.import-summary .dlg>.row .btn.ghost{flex:0 0 auto;padding:0 var(--sp-5)}.import-summary .dlg>.row .btn{white-space:nowrap}
/* one pill style */
.mtag,.match-modal .mm-tag,.import-summary .pill,.import-summary .pill-warn,.item-points .pi-meta em{display:inline-block;padding:var(--sp-1) var(--sp-2);border-radius:var(--radius-pill);font:600 var(--t-xs) var(--sans);font-style:normal}
/* rename chip matches the other match chips */
.match-modal .mm-row>.chip{border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--s1);border-radius:var(--radius-control);min-height:44px;height:auto;padding:var(--sp-2) var(--sp-3);white-space:normal;text-align:left;align-self:stretch}
.match-modal .mm-row>.chip.on{background:var(--ac);color:var(--acx);box-shadow:none;align-self:stretch}
.match-modal .mm-row .chip:not(.alt).on{align-self:stretch}
/* selection tick no longer covers the points figure */
body.selmode .card-points{right:44px}
:root[data-layout=grid] body.selmode .card-points{right:36px}
/* sheet bars respect the notch */
.sheet .bar{top:0}
/* dynamic viewport units (iOS toolbar) */
body{min-height:100vh;min-height:100dvh}
.dlg{max-height:90vh;max-height:90dvh}
.dlg.rpt{max-height:88vh;max-height:88dvh}
.dlg .row{max-height:55vh;max-height:55dvh}
.import-summary .dlg>.row{max-height:none}
.vw{height:min(72vh,640px);height:min(72dvh,640px)}
/* side safe areas on overlays */
.backdrop{padding:max(var(--sp-4),env(safe-area-inset-top)) max(var(--sp-4),env(safe-area-inset-right)) max(var(--sp-4),env(safe-area-inset-bottom)) max(var(--sp-4),env(safe-area-inset-left))}
.backdrop.amenu{padding:0}
.backdrop.top{padding-top:calc(env(safe-area-inset-top,0px) + 72px)}

/* ---------- global press flash ----------
   One delegated listener gives every interactive control the identical click animation:
   the accent flash is applied on pointerdown via .hv-press and held for 400ms, then the
   class is removed so the colour fades back over the standard 220ms transition.
   Disabled controls and inert (blocked-behind-overlay) contexts are skipped. */
const PRESS_SEL='.btn,.ib,.qty button,.tile button,.chip,.more,.res-row,#crumbs button,.ddi,.lnk,.tundo,.cwatch,.swt,.vwx,.vwn,.vwr,button.strow,.card,.gh,.crow,.srow,#add,button.mrow,.is-sec summary';
document.addEventListener('pointerdown',e=>{const t=e.target&&e.target.closest?e.target.closest(PRESS_SEL):null;
 if(!t||t.matches(':disabled')||t.closest('[inert]'))return;
 t.classList.add('hv-press');clearTimeout(t._pt);t._pt=setTimeout(()=>{t.classList.remove('hv-press');t._pt=0},400)},{capture:true});

  const set=(k,v)=>{s[k]=v;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}k==='theme'?fadeApply():apply()};

/* ---------- points foundations (phase 1): schema, migration helpers, unit maths. No UI uses these yet. ---------- */
const POINTS_SCHEMA_VERSION=1;
const POINTS_STORES=['pointsProfiles','unitConfigurations','pointsMappings'];
const sizeOk=n=>Number.isInteger(n)&&n>0&&n<=999;
const cfgOk=c=>c===undefined||(Array.isArray(c)&&c.every(u=>u&&typeof u==='object'&&sizeOk(u.size)));
const pidOk=v=>v===undefined||v===null||(typeof v==='string'&&v!=='');
/* every write of a model or collection goes through these, so old records, old backups and bin restores are upgraded on the way in */
function normItem(o){if(o&&typeof o==='object'){if(!Array.isArray(o.unitConfiguration))o.unitConfiguration=[];if(o.pointsProfileId===undefined||!pidOk(o.pointsProfileId))o.pointsProfileId=null}return o}
function normCol(o){if(o&&typeof o==='object'&&(o.pointsProfileId===undefined||!pidOk(o.pointsProfileId)))o.pointsProfileId=null;return o}
/* ordered schema migrations, run inside the IndexedDB upgrade transaction (atomic with the new stores). Add MIGRATIONS[2] etc. for future versions. */
const MIGRATIONS={
 1:tx=>{for(const [n,f] of [['items',normItem],['collections',normCol]]){
  const rq=tx.objectStore(n).openCursor();
  rq.onerror=e=>{e.preventDefault()};
  rq.onsuccess=()=>{const c=rq.result;if(!c)return;
   try{const v=c.value,before=JSON.stringify([v.unitConfiguration,v.pointsProfileId]);f(v);
    if(before!==JSON.stringify([v.unitConfiguration,v.pointsProfileId])){const u=c.update(v);u.onerror=e=>{e.preventDefault()}}}catch(_){}
   c.continue()}}}};
/* ---- unit definitions come from MFM YAML: { name, pricing:[{ range:"[1,)", costs:[{models,points}] }] } ---- */
const unitPricing=u=>Array.isArray(u&&u.pricing)?u.pricing:[];
function parseRange(r){const m=/^\s*([\[(])\s*(\d+)\s*,\s*(\d*)\s*([\])])\s*$/.exec(String(r==null?'':r));if(!m)return null;
 let lo=+m[2],hi=m[3]===''?Infinity:+m[3];if(m[1]==='(')lo++;if(m[4]===')'&&hi!==Infinity)hi--;return{lo,hi}}
/* every legal unit size for a unit definition, ascending */
/* 1st-unit pricing tier only: 2nd/3rd-unit tiers are ignored entirely. Falls back to the first pricing entry if no range parses. Add-on costs are never unit sizes. */
function tierOne(u){const all=unitPricing(u).filter(p=>p&&typeof p==='object');const t=all.filter(p=>{const r=parseRange(p.range);return r&&r.lo<=1&&r.hi>=1});return t.length?t:all.slice(0,1)}
function unitSizeOptions(u){const s=new Set();tierOne(u).forEach(p=>(Array.isArray(p.costs)?p.costs:[]).forEach(c=>{if(c&&!c.addon&&sizeOk(c.models))s.add(c.models)}));return[...s].sort((a,b)=>a-b)}
const isVariableSizeUnit=u=>unitSizeOptions(u).length>1;
/* points for a unit of this size; null when the size is not priced. Every unit is priced at its 1st-unit rate: nth is accepted for compatibility but ignored (2nd/3rd-unit tiers are not used). */
function unitPointsFor(u,size,nth=1){for(const p of tierOne(u)){
 const c=(Array.isArray(p.costs)?p.costs:[]).find(c=>c&&!c.addon&&c.models===size&&Number.isFinite(c.points));if(c)return c.points}return null}
/* models are always split into the SMALLEST legal unit size; whatever cannot fill a unit is a leftover (see getSpareModels / the stored spareModels) and is never priced */
function generateAutoUnitConfiguration(models,u){
 const n=Math.max(0,Math.min(999,Math.floor(+models)||0)),sizes=unitSizeOptions(u).sort((a,b)=>a-b);
 if(!n||!sizes.length)return[];
 const smallest=sizes[0];
 const out=[];
 let remaining=n;
 while(remaining>=smallest){
   out.push({size:smallest});
   remaining-=smallest;
 }
 return out.sort((a,b)=>a.size-b.size)}
/* the unit configuration in effect: always derived from the models currently owned, so a quantity change or an older saved split can never leave stale units behind (item.unitConfiguration is only a cached copy) */
function getUnitConfiguration(item,u){return generateAutoUnitConfiguration(sq0(item||{}),u)}
const calculateOwnedUnits=(item,u)=>getUnitConfiguration(item,u).length;
/* startIndex lets a caller price a model's units after earlier units of the same datasheet (for "1st to 2nd units" pricing tiers) */
function priceUnitConfiguration(item,u,startIndex=1){const cfg=getUnitConfiguration(item,u),unpriced=[];let points=0;
 cfg.forEach((c,i)=>{const p=unitPointsFor(u,c.size,startIndex+i);if(p==null)unpriced.push(c.size);else points+=p});
 return{units:cfg.length,points,unpriced}}
const calculateOwnedPoints=(item,u,startIndex=1)=>priceUnitConfiguration(item,u,startIndex).points;
const getSpareModels=(item,u)=>Math.max(0,sq0(item||{})-getUnitConfiguration(item,u).reduce((a,c)=>a+c.size,0));
/* col: a collection record or its id. Returns the profile record or null; with {inherit:true} the nearest parent collection with a profile is used. */
async function getCollectionPointsProfile(col,opts){let c=typeof col==='string'?await DB.get('collections',col):col;
 for(let n=0;c&&n<64;n++){if(c.pointsProfileId)return(await DB.get('pointsProfiles',c.pointsProfileId))||null;
  if(!(opts&&opts.inherit)||c.parentId===ROOT)break;c=await DB.get('collections',c.parentId)}return null}
async function setCollectionPointsProfile(col,profileId){const c=typeof col==='string'?await DB.get('collections',col):col;
 if(!c)throw new Error('Collection not found');
 if(profileId!=null&&!await DB.get('pointsProfiles',profileId))throw new Error('Points profile not found');
 c.pointsProfileId=profileId==null?null:profileId;await DB.put('collections',c);
 if(profileId!=null&&typeof reconcileCollectionPoints==='function')await reconcileCollectionPoints(c.id);
 return c}

/* ---------- DB layer ---------- */
const DB=(()=>{let db;
const R=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const T=(s,m='readonly')=>{if(!db)throw new Error('Storage is reconnecting. Please try again in a moment.');return db.transaction(s,m)};
const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Transaction aborted'))});
const open=()=>new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('IndexedDB is not available'));
 const r=indexedDB.open('hobby-vault',4);
 r.onupgradeneeded=()=>{const d=r.result;
  if(!d.objectStoreNames.contains('collections')){
   d.createObjectStore('collections',{keyPath:'id'}).createIndex('parentId','parentId');
   d.createObjectStore('items',{keyPath:'id'}).createIndex('parentId','parentId');
   d.createObjectStore('photos',{keyPath:'id'}).createIndex('itemId','itemId')}
  const ps=r.transaction.objectStore('photos');if(!ps.indexNames.contains('itemOrder'))ps.createIndex('itemOrder',['itemId','sortOrder']);
  /* recycling bin: entry metadata in 'bin', the deleted photos in 'binPhotos' (kept apart so they never show up as live photos) */
  if(!d.objectStoreNames.contains('bin'))d.createObjectStore('bin',{keyPath:'id'});
  if(!d.objectStoreNames.contains('binPhotos'))d.createObjectStore('binPhotos',{keyPath:'id'}).createIndex('binId','binId');
  /* points foundations: three new stores plus a small meta store that records the applied schema version */
  POINTS_STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})});
  if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});
  {const tx=r.transaction,meta=tx.objectStore('meta'),g=meta.get('pointsSchemaVersion');
   g.onerror=e=>{e.preventDefault()};
   g.onsuccess=()=>{const have=g.result?(g.result.value|0):0;if(have>=POINTS_SCHEMA_VERSION)return;
    for(let v=have+1;v<=POINTS_SCHEMA_VERSION;v++)if(MIGRATIONS[v])MIGRATIONS[v](tx);
    meta.put({key:'pointsSchemaVersion',value:POINTS_SCHEMA_VERSION,updated:Date.now()})}}};
 r.onsuccess=()=>{db=r.result;
  /* another window upgraded the database, or the system closed the connection: drop the handle so calls fail clearly, and reconnect after an unexpected close */
  db.onversionchange=()=>{try{db.close()}catch(_){}db=null;toast('The database was updated in another window. Reload the app to continue.',true)};
  db.onclose=()=>{db=null;open().catch(()=>{})};ok()};r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('Database is blocked by another tab'))});
const get=(s,id)=>R(T(s).objectStore(s).get(id));
const put=async(s,o)=>{if(s==='items')normItem(o);else if(s==='collections')normCol(o);const t=T(s,'readwrite');t.objectStore(s).put(o);await done(t);return o};
const by=(s,ix,k)=>R(T(s).objectStore(s).index(ix).getAll(IDBKeyRange.only(k)));
const count=(s,k)=>R(T(s).objectStore(s).index('parentId').count(IDBKeyRange.only(k)));
const photos=async id=>(await by('photos','itemId',id)).sort((a,b)=>a.sortOrder-b.sortOrder);
const delPhoto=async id=>{const t=T('photos','readwrite');t.objectStore('photos').delete(id);await done(t)};
const putPhotos=async list=>{const t=T('photos','readwrite');list.forEach(p=>t.objectStore('photos').put(p));await done(t)};
const wipe=async(cols,items)=>{const t=T(['collections','items','photos'],'readwrite');
 const c=t.objectStore('collections'),i=t.objectStore('items'),p=t.objectStore('photos'),ix=p.index('itemId');
 cols.forEach(id=>c.delete(id));
 for(const id of items){i.delete(id);(await R(ix.getAllKeys(IDBKeyRange.only(id)))).forEach(k=>p.delete(k))}
 await done(t)};
const photoCounts=()=>new Promise((ok,no)=>{const m=new Map(),r=T('photos').objectStore('photos').index('itemId').openKeyCursor();
 r.onsuccess=()=>{const c=r.result;if(!c)return ok(m);m.set(c.key,(m.get(c.key)||0)+1);c.continue()};r.onerror=()=>no(r.error)});
const thumbs=ids=>new Promise((ok,no)=>{const m=new Map();ids=[...new Set(ids)];if(!ids.length)return ok(m);
 const t=T('photos'),st=t.objectStore('photos'),io=st.index('itemOrder'),ii=st.index('itemId');let left=ids.length;const fin=()=>{if(!--left)ok(m)};
 t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Thumbnail read failed'));
 ids.forEach(id=>{const r=io.openCursor(IDBKeyRange.bound([id,-Infinity],[id,Infinity]));
  r.onsuccess=()=>{const c=r.result;if(c){m.set(id,c.value.thumb||c.value.blob);return fin()}
   /* fallback for any legacy record without a sortOrder */
   const n=ii.count(IDBKeyRange.only(id));n.onsuccess=()=>{if(!n.result)return fin();
    const g=ii.getAll(IDBKeyRange.only(id));g.onsuccess=()=>{const l=g.result.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0))[0];if(l)m.set(id,l.thumb||l.blob);fin()}}}})});
const all=s=>R(T(s).objectStore(s).getAll());
const usage=async()=>{const r=await new Promise((ok,no)=>{let n=0,b=0;const q=T('photos').objectStore('photos').openCursor();
 q.onsuccess=()=>{const c=q.result;if(!c)return ok({n,b});const v=c.value;n++;b+=(v.blob?v.blob.size:0)+(v.thumb?v.thumb.size:0);c.continue()};q.onerror=()=>no(q.error)});
 (await all('collections')).forEach(c=>{if(c.icon instanceof Blob)r.b+=c.icon.size});return r};
const setThumb=(id,thumb)=>new Promise((ok,no)=>{const t=T('photos','readwrite'),st=t.objectStore('photos'),g=st.get(id);
 g.onsuccess=()=>{const v=g.result;if(v){v.thumb=thumb;v.th=2;st.put(v)}};t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('Transaction aborted'))});
const photoKeys=()=>R(T('photos').objectStore('photos').getAllKeys());
const replaceAll=async d=>{const t=T(['collections','items','photos'],'readwrite');
 for(const n of ['collections','items','photos']){const o=t.objectStore(n);o.clear();(d[n]||[]).forEach(r=>o.put(n==='items'?normItem(r):n==='collections'?normCol(r):r))}await done(t)};
const putMany=async(cols,items,photos)=>{const t=T(['collections','items','photos'],'readwrite');cols.forEach(r=>t.objectStore('collections').put(normCol(r)));items.forEach(r=>t.objectStore('items').put(normItem(r)));photos.forEach(r=>t.objectStore('photos').put(r));await done(t)};
/* generic helpers for the points stores: add or update records, or replace the whole store, each in one transaction */
const putList=async(s,list)=>{const t=T(s,'readwrite'),o=t.objectStore(s);list.forEach(r=>o.put(r));await done(t)};
const setList=async(s,list)=>{const t=T(s,'readwrite'),o=t.objectStore(s);o.clear();list.forEach(r=>o.put(r));await done(t)};
const pointsSchemaVersion=async()=>{const r=await get('meta','pointsSchemaVersion');return r?(r.value|0):0};
const binAdd=async(e,list)=>{const t=T(['bin','binPhotos'],'readwrite');t.objectStore('bin').put(e);list.forEach(x=>t.objectStore('binPhotos').put({...x,binId:e.id}));await done(t)};
const binDrop=async ids=>{const t=T(['bin','binPhotos'],'readwrite'),b=t.objectStore('bin'),q=t.objectStore('binPhotos'),ix=q.index('binId');
 for(const id of ids){b.delete(id);(await R(ix.getAllKeys(IDBKeyRange.only(id)))).forEach(k=>q.delete(k))}await done(t)};
const binPhotos=async id=>(await by('binPhotos','binId',id)).map(({binId,...x})=>x);
const binClear=async()=>{const t=T(['bin','binPhotos'],'readwrite');t.objectStore('bin').clear();t.objectStore('binPhotos').clear();await done(t)};
const binPhotoKeys=()=>R(T('binPhotos').objectStore('binPhotos').getAllKeys());
const binReplace=async(es,ps)=>{const t=T(['bin','binPhotos'],'readwrite'),a=t.objectStore('bin'),b=t.objectStore('binPhotos');a.clear();b.clear();es.forEach(x=>a.put(x));ps.forEach(x=>b.put(x));await done(t)};
const binUsage=()=>new Promise((ok,no)=>{let n=0,b=0;const q=T('binPhotos').objectStore('binPhotos').openCursor();
 q.onsuccess=()=>{const c=q.result;if(!c)return ok({n,b});const v=c.value;n++;b+=(v.blob?v.blob.size:0)+(v.thumb?v.thumb.size:0);c.continue()};q.onerror=()=>no(q.error)});
const putBin=async(es,ps)=>{const t=T(['bin','binPhotos'],'readwrite');es.forEach(x=>t.objectStore('bin').put(x));ps.forEach(x=>t.objectStore('binPhotos').put(x));await done(t)};
/* keeps only the listed keys in each named store, all in one transaction */
const prune=async keep=>{const names=Object.keys(keep),t=T(names,'readwrite');
 const lists=await Promise.all(names.map(n=>R(t.objectStore(n).getAllKeys())));
 names.forEach((n,i)=>lists[i].forEach(k=>{if(!keep[n].has(k))t.objectStore(n).delete(k)}));await done(t)};
const clearAll=async()=>{const n=['collections','items','photos','bin','binPhotos',...POINTS_STORES],t=T(n,'readwrite');n.forEach(x=>t.objectStore(x).clear());await done(t)};
/* restoring from the bin is one transaction: the live data goes in and the bin entry goes out together, so a failure changes nothing */
const binRestoreTx=async(e,ph)=>{const t=T(['collections','items','photos','bin','binPhotos'],'readwrite');
 e.cols.forEach(c=>t.objectStore('collections').put(normCol(c)));e.items.forEach(i=>t.objectStore('items').put(normItem(i)));
 ph.forEach(x=>{t.objectStore('photos').put(x);t.objectStore('binPhotos').delete(x.id)});t.objectStore('bin').delete(e.id);await done(t)};
const binPhotoLinks=()=>new Promise((ok,no)=>{const o=[],q=T('binPhotos').objectStore('binPhotos').index('binId').openKeyCursor();
 q.onsuccess=()=>{const c=q.result;if(!c)return ok(o);o.push({id:c.primaryKey,binId:c.key});c.continue()};q.onerror=()=>no(q.error)});
const binPhotoDel=async ids=>{const t=T('binPhotos','readwrite'),st=t.objectStore('binPhotos');ids.forEach(k=>st.delete(k));await done(t)};
const delItem=id=>wipe([],[id]);
const delCollection=async id=>{const cols=[id],items=[];
 for(let n=0;n<cols.length;n++){(await by('collections','parentId',cols[n])).forEach(c=>{if(!cols.includes(c.id))cols.push(c.id)});
  (await by('items','parentId',cols[n])).forEach(x=>items.push(x.id))}
 await wipe(cols,items)};

/* ---------- motion system (tokens live in CSS) ---------- */

async function hashBlob(b){try{const d=await crypto.subtle.digest('SHA-256',await b.arrayBuffer());return[...new Uint8Array(d)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}

 for(const f of fs){try{const img=await load(f),blob=await shrink(img,...pq()),thumb=await shrink(img,640,.82),sh=await hashBlob(f),bh=await hashBlob(blob);
  const dup=!!((sh&&seen.has(sh))||(bh&&seen.has(bh)));if(sh)seen.add(sh);if(bh)seen.add(bh);out.push({f,blob,thumb,sh,bh,dup})}catch(e){toast(e.message||'Could not add photo',true)}}
 const d=out.filter(x=>x.dup);
 if(d.length){const names=d.slice(0,3).map(x=>x.f.name||'photo').join(', ')+(d.length>3?` and ${d.length-3} more`:'');
  const keep=await dlg({title:'Duplicate photo',msg:`${d.length===1?'This photo looks':d.length+' photos look'} the same as ${d.length===1?'one':'ones'} already on this model: ${names}.\nAdd ${d.length===1?'it':'them'} anyway? Cancel skips ${d.length===1?'it':'them'}.`,ok:'Add anyway'});
  if(!keep)return out.filter(x=>!x.dup)}

 const R={cols,items,nPh:keys.length,orphan:[],damaged:[],noThumb:[],order:new Set(),itemsLost:[],colsLost:[],colsLoop:[],badData:[],binOrphan:[],badCfg:[],badCfgCols:[]};
 const pid=R.pid=new Set(profs.map(p=>p.id)),badP=v=>!pidOk(v)||(v&&!pid.has(v));
 items.forEach(i=>{if(!cfgOk(i.unitConfiguration)||badP(i.pointsProfileId))R.badCfg.push(i)});
 cols.forEach(c=>{if(badP(c.pointsProfileId))R.badCfgCols.push(c)});
 {const bid=new Set(bins.map(e=>e.id)),good=new Set(bLinks.filter(l=>bid.has(l.binId)).map(l=>l.id));R.binOrphan=bKeys.filter(k=>!good.has(k))}
 cols.forEach(c=>{if(c.parentId!==ROOT&&!cid.has(c.parentId)){R.colsLost.push(c);return}
  let x=byId.get(c.parentId),n=0;for(;x&&n<5000;x=byId.get(x.parentId),n++)if(x.id===c.id){R.colsLoop.push(c);break}});

  const q=i.qty,badQ=q!==undefined&&(!Number.isInteger(q)||q<0||q>999),badS=i.status!==undefined&&i.status!=='based'&&!STATUS.some(x=>x[0]===i.status);
  let badSp=false;if(i.split!==undefined&&i.split!==null){badSp=typeof i.split!=='object'||STATUS.reduce((a,[k])=>a+Math.max(0,Math.floor(+i.split[k]||0)),0)!==sq0(i)}

async function checkRepair(){

 if(R.badData.length)L.push(`${pl(R.badData.length,'model')} have an invalid quantity, status or split, which will be tidied.`);
 if(R.badCfg.length+R.badCfgCols.length)L.push(`${pl(R.badCfg.length+R.badCfgCols.length,'entry').replace('entrys','entries')} have invalid points settings, which will be reset.`);

 if(!L.length){toast(`No problems found (${pl(R.cols.length,'collection')}, ${pl(R.items.length,'model')}, ${pl(R.nPh,'photo')} checked)`);return}
 if(!await dlg({title:'Problems found',msg:L.join('\n')+'\nFix them now? Consider exporting a backup first.',ok:'Fix problems'}))return;
 toast('Repairing…');
 for(const k of [...R.orphan,...R.damaged])await DB.delPhoto(k);
 if(R.binOrphan.length)await DB.binPhotoDel(R.binOrphan);
 for(const c of [...R.colsLost,...R.colsLoop]){c.parentId=ROOT;await DB.put('collections',c)}
 for(const i of R.itemsLost){i.parentId=ROOT;await DB.put('items',i)}
 for(const i of R.badData){if(!Number.isInteger(i.qty)&&i.qty!==undefined||i.qty<0||i.qty>999)i.qty=Math.max(0,Math.min(999,Number.isInteger(i.qty)?i.qty:1));
  if(i.status!==undefined&&i.status!=='based'&&!STATUS.some(x=>x[0]===i.status))i.status='unbuilt';
  if(i.split!==undefined)fitSplit(i);if(i.split===null)delete i.split;await DB.put('items',i)}

 for(const i of R.badCfg){i.unitConfiguration=Array.isArray(i.unitConfiguration)?i.unitConfiguration.filter(x=>x&&typeof x==='object'&&sizeOk(x.size)):[];
  if(i.pointsProfileId&&!pid.has(i.pointsProfileId)||!pidOk(i.pointsProfileId))i.pointsProfileId=null;await DB.put('items',i)}
 for(const c of R.badCfgCols){c.pointsProfileId=null;await DB.put('collections',c)}
 for(const k of R.noThumb){try{const x=await DB.get('photos',k);if(x&&x.blob)await DB.setThumb(k,await shrink(await load(x.blob),640,.82))}catch(e){}}
 for(const id of R.order){const l=await DB.photos(id);l.sort((a,b)=>(Number.isFinite(a.sortOrder)?a.sortOrder:1e9)-(Number.isFinite(b.sortOrder)?b.sortOrder:1e9));l.forEach((p,n)=>p.sortOrder=n);await DB.putPhotos(l)}

/* ---------- streaming backup reader: the file is read in 4 MB pieces and one record is parsed at a time, so a backup of any size never has to fit in memory ---------- */
async function* jsonTop(file,CH=4194304){
 const bad=()=>new Error('That file is not a valid backup'),dec=new TextDecoder(),SQ=/["\\]/g,OB=/["{}]/g,size=file.size,parse=x=>{try{return JSON.parse(x)}catch(_){throw bad()}};
 let st=0,key='',cx='',kind='',depth=0,inStr=false,escP=false,buf=[];
 /* st: 0 before the top object, 1 expecting a key, 2 expecting a colon, 3 expecting a value, 4 inside a top-level array, 5 reading a value or element, 7 reading a key */
 for(let off=0;off<size||off===0;off+=CH){
  const t=dec.decode(await file.slice(off,off+CH).arrayBuffer(),{stream:off+CH<size}),n=t.length;
  let i=0,from=0;
  if(off===0&&n&&t.charCodeAt(0)===65279)i=1;
  if(escP&&n){i=1;escP=false}
  while(i<n){
   if(st===5||st===7){
    let end=-1;
    if(kind==='x'){while(i<n&&!/[,}\]\s]/.test(t[i]))i++;if(i<n)end=i}
    else if(inStr){SQ.lastIndex=i;const m=SQ.exec(t);
     if(!m)i=n;
     else if(m[0]==='\\'){i=m.index+2;if(i>n){escP=true;i=n}}
     else{i=m.index+1;inStr=false;if(kind==='s')end=i}}
    else{OB.lastIndex=i;const m=OB.exec(t);
     if(!m)i=n;
     else{i=m.index+1;if(m[0]==='"')inStr=true;else if(m[0]==='{')depth++;else if(--depth===0)end=i}}
    if(end<0)continue;
    buf.push(t.slice(from,end));const text=buf.join('');buf=[];
    if(cx==='k'){key=parse(text);st=2}
    else if(cx==='v'){st=1;yield{k:key,v:parse(text)}}
    else{st=4;yield{k:key,e:parse(text)}}
    continue}
   const c=t[i];
   if(c<=' '){i++;continue}
   if(st===0){if(c!=='{')throw bad();st=1;i++;continue}
   if(st===1){if(c===','){i++;continue}if(c==='}')return;if(c!=='"')throw bad();st=7;cx='k';kind='s';inStr=true;from=i;i++;continue}
   if(st===2){if(c!==':')throw bad();st=3;i++;continue}
   if(st===4&&c===','){i++;continue}
   if(st===4&&c===']'){st=1;i++;continue}
   if(st===3&&c==='['){st=4;i++;yield{k:key,start:1};continue}
   cx=st===3?'v':'e';st=5;from=i;
   if(c==='"'){kind='s';inStr=true;i++}else if(c==='{'){kind='o';depth=1;inStr=false;i++}else kind='x'}
  if(st===5||st===7)buf.push(t.slice(from));
 }
 throw bad()}
/* first pass: reads the whole backup but keeps only the small records and a light index of the photos */
async function scanBackup(file){
 const S={app:null,exported:null,settings:null,pointsSchema:0,pointsProfiles:[],unitConfigurations:[],pointsMappings:[],collections:[],items:[],photos:[],bin:[],binPhotos:[],has:{},skipped:0};
 const okId=v=>v&&typeof v==='object'&&v.id!=null&&v.id!=='',isD=b=>typeof b==='string'&&b.startsWith('data:');
 for await(const ev of jsonTop(file)){
  const k=ev.k;
  if(ev.start){S.has[k]=true;continue}
  if('v' in ev){if(k==='app'||k==='exported'||k==='settings'||k==='pointsSchema')S[k]=ev.v;continue}
  const e=ev.e;
  if(k==='collections'||k==='items'||POINTS_STORES.includes(k)){okId(e)?S[k].push(e):S.skipped++}
  else if(k==='photos')S.photos.push({id:e&&e.id,itemId:e&&e.itemId,ok:!!(e&&e.id&&isD(e.blob))});
  else if(k==='bin'){if(okId(e)&&Array.isArray(e.cols)&&Array.isArray(e.items))S.bin.push(e)}
  else if(k==='binPhotos')S.binPhotos.push({id:e&&e.id,binId:e&&e.binId,ok:!!(e&&e.id&&e.binId&&isD(e.blob))});
 }
 return S}
/* second pass: writes the wanted photos in small batches, one record decoded at a time */
async function pumpPhotos(file,okP,okB){
 let ph=[],bp=[],sz=0,n=0;
 const flush=async()=>{if(ph.length)await DB.putMany([],[],ph);if(bp.length)await DB.putBin([],bp);ph=[];bp=[];sz=0},
  dec=e=>({...e,blob:d2b(e.blob),thumb:e.thumb?d2b(e.thumb):undefined});
 for await(const ev of jsonTop(file)){
  const e=ev.e;if(!e)continue;
  if(ev.k==='photos'&&okP.has(e.id)){const x=dec(e);ph.push(x);sz+=x.blob.size+(x.thumb?x.thumb.size:0);n++}
  else if(ev.k==='binPhotos'&&okB.has(e.id)){const x=dec(e);bp.push(x);sz+=x.blob.size+(x.thumb?x.thumb.size:0)}
  else continue;
  if(sz>16e6||ph.length+bp.length>=24)await flush()}
 await flush();return n}
/* Replace: the backup is written in first and only then is anything that is not in it removed. A failure part-way leaves the old data in place, never a half-empty vault. */
async function replaceFromFile(file,d){
 const strip=x=>{const{icon,...r}=x;return typeof icon==='string'?{...r,icon:d2b(icon)}:r};
 const cols=d.collections.map(strip),be=d.bin.map(e=>({...e,cols:e.cols.map(strip)})),bid=new Set(be.map(e=>e.id));
 const okP=new Set(d.photos.map(x=>x.id)),okB=new Set(d.binPhotos.filter(x=>x.ok&&bid.has(x.binId)).map(x=>x.id));
 await DB.putMany(cols,d.items,[]);await DB.putBin(be,[]);
 await pumpPhotos(file,okP,okB);
 await DB.prune({collections:new Set(cols.map(c=>c.id)),items:new Set(d.items.map(i=>i.id)),photos:okP,bin:bid,binPhotos:okB});
 /* points stores: replaced only when the backup carries them, so an older backup never wipes profiles */
 for(const n of POINTS_STORES)if(d.has[n])await DB.setList(n,d[n])}
/* after a merge, photos that share a position with existing ones are renumbered (existing photos first) */
async function fixOrder(ids,fresh){for(const id of ids){const l=await DB.photos(id),fin=v=>Number.isFinite(v)?v:1e9;
 if(new Set(l.map(x=>x.sortOrder)).size===l.length&&l.every(x=>Number.isFinite(x.sortOrder)))continue;
 l.sort((a,b)=>fin(a.sortOrder)-fin(b.sortOrder)||(fresh.has(a.id)?1:0)-(fresh.has(b.id)?1:0));l.forEach((x,n)=>x.sortOrder=n);await DB.putPhotos(l)}}

/* ---------- import check ---------- */

 const[cc,ci,ck]=await Promise.all([DB.all('collections'),DB.all('items'),DB.photoKeys()]);
 const cid=new Set(d.collections.map(c=>c&&c.id)),iid=new Set(d.items.map(x=>x&&x.id)),okP=id=>id===ROOT||cid.has(id);
 const badC=d.collections.filter(c=>c&&!okP(c.parentId)),badI=d.items.filter(x=>x&&!okP(x.parentId));
 const good=d.photos.filter(p=>p&&iid.has(p.itemId)&&p.ok),skipped=d.photos.length-good.length;
 let free=null;try{const e=await navigator.storage.estimate();if(e&&e.quota)free=e.quota-(e.usage||0)}catch(_){}
 const when=new Date(d.exported),L=[],pl=(n,w)=>n+' '+w+(n===1?'':'s');
 L.push(isNaN(when)?`File size ${fmtB(size)}.`:`Backup made ${when.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}, file size ${fmtB(size)}.`);
 L.push(`In the backup: ${pl(d.collections.length,'collection')}, ${pl(d.items.length,'model')}, ${pl(good.length,'photo')}.`);
 if(d.pointsProfiles.length)L.push(`The backup also holds ${pl(d.pointsProfiles.length,'points profile')}, which will replace the current ones.`);

 if(lessI>0||lessP>0)L.push(`Warning: the backup has ${[lessI>0?lessI+' fewer model'+(lessI===1?'':'s'):'',lessP>0?lessP+' fewer photo'+(lessP===1?'':'s'):''].filter(Boolean).join(' and ')} than you have now. Anything added since will be lost.`);
 if(badC.length+badI.length){const n=badC.length+badI.length;L.push(`${n} entr${n===1?'y sits':'ies sit'} inside collections that are missing from the backup and will be moved to the top level.`)}

 L.push('Importing deletes all current data.');

/* ---------- Merge / Skip Duplicates import: models and collections match by ID, the backup wins on Merge ---------- */
async function mergeBackup(d,size,skip,file){
 const[cc,ci,ck]=await Promise.all([DB.all('collections'),DB.all('items'),DB.photoKeys()]);
 const hc=new Set(cc.map(c=>c.id)),hi=new Set(ci.map(i=>i.id)),hp=new Set(ck);
 const inC=d.collections,inI=d.items;
 const dupC=inC.filter(c=>hc.has(c.id)),dupI=inI.filter(x=>hi.has(x.id)),newC=inC.filter(c=>!hc.has(c.id)),newI=inI.filter(x=>!hi.has(x.id));
 const useC=(skip?newC:inC).map(c=>({...c})),useI=(skip?newI:inI).map(x=>({...x})),okI=new Set(useI.map(x=>x.id));
 const photos=d.photos.filter(p=>p.ok&&okI.has(p.itemId)&&!(skip&&hp.has(p.id)));
 const newP=photos.filter(p=>!hp.has(p.id)).length;
 if(!useC.length&&!useI.length&&!photos.length){toast('Nothing to import: everything in the backup is already here');return}
 const L=[`In the backup: ${plu(inC.length,'collection')}, ${plu(inI.length,'model')}, ${plu(d.photos.length,'photo')}.`,
  `New: ${plu(newC.length,'collection')}, ${plu(newI.length,'model')}, ${plu(newP,'photo')}.`,
  `Already here (same ID): ${plu(dupC.length,'collection')}, ${plu(dupI.length,'model')}, ${skip?'left untouched.':'updated from the backup.'}`,
  'Nothing is deleted.'];
 if(!d.photos.length)L.push('This backup has no photos, so current photos stay as they are.');
 if(d.skipped)L.push(`${plu(d.skipped,'entry').replace('entrys','entries')} without an ID will be skipped.`);
 if(size>2e7)L.push(`Large file (${fmtB(size)}). This may take a moment.`);
 if(!await dlg({title:skip?'Skip duplicates?':'Merge backup?',msg:L.join('\n'),ok:skip?'Import new only':'Merge'}))return;
 toast('Importing…');
 const fin=new Map(cc.map(c=>[c.id,c]));useC.forEach(c=>fin.set(c.id,c));
 useC.forEach(c=>{if(c.parentId!==ROOT&&!fin.has(c.parentId))c.parentId=ROOT});
 useC.forEach(c=>{const seen=new Set([c.id]);for(let p=fin.get(c.parentId);p;p=fin.get(p.parentId)){if(seen.has(p.id)){c.parentId=ROOT;break}seen.add(p.id)}});
 useI.forEach(x=>{if(x.parentId!==ROOT&&!fin.has(x.parentId))x.parentId=ROOT});
 const cols=useC.map(x=>{const{icon,...r}=x;return typeof icon==='string'?{...r,icon:d2b(icon)}:r});
 await DB.putMany(cols,useI,[]);
 for(const n of POINTS_STORES){if(!d[n].length)continue;const have=new Set((await DB.all(n)).map(r=>r.id));await DB.putList(n,skip?d[n].filter(r=>!have.has(r.id)):d[n])}
 const okP=new Set(photos.map(p=>p.id));
 if(okP.size){await pumpPhotos(file,okP,new Set());await fixOrder(new Set(photos.map(p=>p.itemId)),okP)}
 await afterReplace();
 toast(skip?`Added ${plu(newI.length,'new model')}`:`Merged: ${plu(newI.length,'new model')}, ${dupI.length} updated`)}

/* ---------- automatic backup (Android app only; manual export above is untouched) ---------- */
const AB='hv-autobackup',AB_KEEP=3;
const abClean=p=>{p=String(p||'').replace(/\\/g,'/').split('/').map(x=>x.trim()).filter(Boolean);return(!p.length||p.some(x=>x==='.'||x==='..'||/[:*?"<>|]/.test(x)))?null:p.join('/')};
/* a path under Documents uses Capacitor's DOCUMENTS directory (as before); any other path is taken from the root of shared storage */
const abTarget=p=>{const c=abClean(p);if(!c)return null;const m=c.match(/^documents\/(.+)$/i);return m?{dir:'DOCUMENTS',sub:m[1],path:c}:{dir:'EXTERNAL_STORAGE',sub:c,path:c}};
const abGet=()=>{const s={on:false,days:7,last:0,tried:0,path:'Documents/HobbyVault'};try{Object.assign(s,JSON.parse(localStorage.getItem(AB)||'{}'))}catch(e){}return s};
const abSet=o=>{try{localStorage.setItem(AB,JSON.stringify({...abGet(),...o}))}catch(e){}};
let abBusy=false;
/* a backup interrupted mid-write leaves a .part file behind; sweep those before writing a new one */
async function abSweep(FS,tg){try{const r=await FS.readdir({path:tg.sub,directory:tg.dir});for(const f of r.files||[]){const x=typeof f==='string'?f:f.name;if(/^hobby-vault-auto-.*\.json\.part$/.test(x))await FS.deleteFile({path:`${tg.sub}/${x}`,directory:tg.dir}).catch(()=>{})}}catch(_){}}
async function autoBackup(manual){
 const FS=plug('Filesystem');if(!isNative()||!FS)throw new Error('Automatic backup needs the Android app with the Filesystem plugin');
 const tg=abTarget(abGet().path);if(!tg)throw new Error('Choose a valid backup folder in Settings');
 if(abBusy)return;abBusy=true;abSet({tried:Date.now()});
 try{
  const[c,i,keys]=await Promise.all([DB.all('collections'),DB.all('items'),DB.photoKeys()]);
  if(!c.length&&!i.length){if(manual)toast('Nothing to back up yet');return}
  try{if(FS.checkPermissions){const st=await FS.checkPermissions();if(st&&st.publicStorage&&st.publicStorage!=='granted'&&FS.requestPermissions)await FS.requestPermissions()}}catch(_){}
  await abSweep(FS,tg);await needSpace(false,false);
  const now=new Date(),stamp=now.toISOString(),pd=n=>String(n).padStart(2,'0'),
   name=`hobby-vault-auto-${now.getFullYear()}-${pd(now.getMonth()+1)}-${pd(now.getDate())}-${pd(now.getHours())}${pd(now.getMinutes())}.json`;
  const cols=[];for(const x of c)cols.push(x.icon instanceof Blob?{...x,icon:await b2d(x.icon)}:x);
  const photo=async k=>{const x=await DB.get('photos',k);return x&&x.blob?JSON.stringify({...x,blob:await b2d(x.blob),thumb:x.thumb?await b2d(x.thumb):null}):null};
  const head=`{"app":"hobby-vault","version":1,"exported":${JSON.stringify(stamp)},"settings":${settingsJson()},"collections":${JSON.stringify(cols)},"items":${JSON.stringify(i)}${await pointsHead()},"photos":[`;
  const dir=tg.dir,tmp=`${tg.sub}/${name}.part`,fin=`${tg.sub}/${name}`,at={path:tmp,directory:dir,encoding:'utf8',recursive:true};
  try{
   await FS.writeFile({...at,data:head});
   let buf='',n=0;const flush=async()=>{if(buf){await FS.appendFile({...at,data:buf});buf=''}};
   for(const k of keys){const x=await photo(k);if(x==null)continue;buf+=(n++?',':'')+x;if(buf.length>3e6)await flush()}
   buf+=']}';await flush();
   /* written under a temporary name and renamed at the end, so a half-finished file is never mistaken for a backup */
   await FS.rename({from:tmp,to:fin,directory:dir,toDirectory:dir});
  }catch(e){try{await FS.deleteFile({path:tmp,directory:dir})}catch(_){}throw e}
  try{const r=await FS.readdir({path:tg.sub,directory:dir}),names=(r.files||[]).map(f=>typeof f==='string'?f:f.name).filter(x=>/^hobby-vault-auto-.*\.json$/.test(x)).sort();
   for(const x of names.slice(0,Math.max(0,names.length-AB_KEEP)))await FS.deleteFile({path:`${tg.sub}/${x}`,directory:dir})}catch(_){}
  abSet({last:Date.now()});toast(`Backup saved to ${tg.path}`)
 }finally{abBusy=false}}
const abCheck=()=>{const s=abGet(),now=Date.now();
 if(!isNative()||!s.on||now-s.last<s.days*864e5||now-s.tried<6*36e5)return;

/* ---------- missing information: models without a photo or category, collections without an icon ---------- */

function yamlNormKey(k){return String(k==null?'':k).toLowerCase().replace(/[^a-z0-9]/g,'')}

function parseMfmYaml(text){

    const lines=yamlLines(rawText);if(!lines.length)throw new Error('The YAML file is empty.');
    [root,pos]=yamlBlock(lines,0,lines[0].indent);

  const rootName=yamlField(root,'name','faction','factionName','profileName');
  const rootVersion=yamlField(root,'version','mfmVersion','formatVersion');

async function savePointsProfile(parsed,existingId=null,newId=null){
  const all=await DB.all('pointsProfiles');
  const old=existingId?all.find(p=>p.id===existingId):all.find(p=>p.slug===parsed.slug);
  const now=new Date().toISOString(),rec={
    id:old?old.id:(newId||ppId()),
    name:parsed.name,
    profileName:`${parsed.name} MFM`,
    slug:parsed.slug,
    version:parsed.version,
    firstSeen:parsed.firstSeen,
    source:PP_SOURCE,
    importedAt:now,
    importDate:ppDate(),
    schema:POINTS_SCHEMA_VERSION,
    units:parsed.units,
    detachments:parsed.detachments,
    /* source metadata: manual imports are 'yaml'; downloads carry their own sourceType/sourceUrl */
    sourceType:parsed.sourceMeta?parsed.sourceMeta.sourceType:'yaml',
    sourceUrl:parsed.sourceMeta?parsed.sourceMeta.sourceUrl:null,
    factionName:parsed.name,
    lastUpdated:now

  if(old&&old.website)rec.website=old.website; /* the profile's website link survives re-imports */
  await DB.putList('pointsProfiles',[rec]);
  return{record:rec,replaced:!!old,previous:old||null};

  if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss'))return w.slice(0,-1);

}
function pointsAliases(u){

}
function pointsLevenshtein(a,b){

function pointsSimilarity(a,b){

  const lev=1-pointsLevenshtein(pointsCompact(na),pointsCompact(nb))/Math.max(pointsCompact(na).length,pointsCompact(nb).length);

function pointsCandidates(item,profile){

function findUnitByMapping(profile,mapping){

/* ---------- import workflow: parse -> exact pass -> matching modal -> save ----------

const POINTS_SUGGEST_MAX=4;

/* in-memory only: classifies every model in scope without touching the database */
async function buildImportPlan(parsed,existingId,newCollectionId){
  const all=await DB.all('pointsProfiles');
  const old=(existingId&&all.find(p=>p.id===existingId))||all.find(p=>p.slug===parsed.slug)||null;
  const profile={id:old?old.id:ppId(),units:parsed.units};
  const[cols,items,maps]=await Promise.all([DB.all('collections'),DB.all('items'),DB.all('pointsMappings')]);
  const roots=old?cols.filter(c=>c.pointsProfileId===old.id).map(c=>c.id):(newCollectionId?[newCollectionId]:[]);
  const ids=new Set(roots);
  /* sub-collections that carry a different profile of their own are not part of this import */
  for(let more=true;more;){more=false;cols.forEach(c=>{if(!ids.has(c.id)&&ids.has(c.parentId)&&(!c.pointsProfileId||c.pointsProfileId===profile.id)){ids.add(c.id);more=true}})}
  const pm=new Map(maps.filter(m=>m.profileId===profile.id).map(m=>[m.itemId,m]));
  const rows=[];
  for(const item of items.filter(i=>ids.has(i.parentId))){
    const m=pm.get(item.id);
    if(m&&m.skipped){rows.push({item,state:'skipped'});continue}
    const kept=findUnitByMapping(profile,m);
    if(kept){rows.push({item,state:'kept',unit:kept,mapping:m});continue}
    const c=pointsCandidates(item,profile);
    if((c.type==='exact'||c.type==='alias')&&c.matches.length===1){rows.push({item,state:'exact',unit:c.matches[0].u,method:c.type});continue}
    const sug=c.type==='fuzzy'?c.matches.filter(x=>x.score>=POINTS_FUZZY_MIN).slice(0,POINTS_SUGGEST_MAX):c.matches.slice(0,POINTS_SUGGEST_MAX);
    rows.push({item,state:'unmatched',suggestions:sug});
  }
  rows.sort((a,b)=>String(a.item.name||'').localeCompare(String(b.item.name||'')));
  return{old,replaced:!!old,parsed,profile,rows,newCollectionId:newCollectionId||null};
}
/* resolves true (save) or false (cancel: nothing was written) */

    d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');

      const list=$('.mm-list',d);
      un.forEach(r=>{
        const box=el('div','mm-row'+(r.choice?' resolved':''));box.append(el('div','mm-name',`<b>${esc(r.item.name||'Untitled')}</b><span class="mm-tag">${r.choice?(r.choice.skip?'Skipped':'Matched'):'Needs a unit'}</span>`));
        if(r.choice){

          else{
            box.append(el('div','mm-state',`→ ${esc(r.choice.unit.name)}${r.choice.method==='fuzzy'?` (${Math.round(r.choice.score*100)}% suggestion)`:''}`));
            if(r.choice.unit.name!==r.item.name){const rn=el('button','chip'+(r.rename?' on':''),r.rename?`Will rename to “${esc(r.choice.unit.name)}”`:`Rename model to “${esc(r.choice.unit.name)}”?`);rn.onclick=()=>{r.rename=!r.rename;render()};box.append(rn)}

          const ch=el('button','btn ghost sm mm-change','Change');ch.onclick=()=>{r.choice=null;r.rename=false;render()};box.append(ch);
        }else{
          const chips=el('div','chips wrap mm-opts');

          const other=el('button','chip alt','Choose another…');other.onclick=()=>pickAny(r);

/* the only place the import writes: profile, collection assignment, mappings, renames and unit configurations */
async function commitImportPlan(plan){
  const saved=await savePointsProfile(plan.parsed,plan.old?plan.old.id:null,plan.profile.id),profile=saved.record;
  if(!plan.old&&plan.newCollectionId){const c=await DB.get('collections',plan.newCollectionId);if(c){c.pointsProfileId=profile.id;await DB.put('collections',c)}}
  let renameSkipped=0;
  for(const r of plan.rows){
    const item=r.item;
    if(r.state==='skipped')continue;
    if(r.state==='unmatched'){
      if(!r.choice)continue;
      if(r.choice.skip){await savePointSkip(profile,item);item.pointsProfileId=profile.id;await DB.put('items',item);continue}
    }
    const unit=r.state==='unmatched'?r.choice.unit:r.unit,variable=isVariableSizeUnit(unit);
    if(r.state==='kept'){const m=r.mapping;if(m.variable!==variable)await savePointMapping(profile,item,unit,m.method,m.score,!variable)}
    else if(r.state==='exact')await savePointMapping(profile,item,unit,r.method,1,!variable);
    else{await savePointMapping(profile,item,unit,r.choice.method,r.choice.score,!variable);
      if(r.rename&&!await renameItemToUnit(item,unit))renameSkipped++}
    item.pointsProfileId=profile.id;await DB.put('items',item);
    await persistUnitConfiguration(item,profile,unit);
  }
  if(renameSkipped)toast(`${renameSkipped} model${renameSkipped===1?'':'s'} kept the current name`);
  return{record:profile,replaced:saved.replaced,previous:saved.previous};
}

async function chooseFuzzyUnit(item,profile,candidates){
  const usable=candidates.filter(x=>x.score>=POINTS_FUZZY_MIN).slice(0,4);
  if(!usable.length)return null;
  const choices=usable.map(x=>({label:`${x.u.name} (${Math.round(x.score*100)}% match)`,value:String(x.index)}));
  const pick=await dlg({title:'Confirm unit match',msg:`“${item.name}” does not exactly match a profile unit. Choose the correct unit once; Hobby Vault will remember this choice for this model and profile.`,choices});
  if(pick==null)return null;
  return usable[Number(pick)]||null;
}
function sameCfg(a,b){
  const x=Array.isArray(a)?a.map(v=>+v.size).filter(sizeOk):[],y=Array.isArray(b)?b.map(v=>+v.size).filter(sizeOk):[];
  return x.length===y.length&&x.every((v,i)=>v===y[i]);

async function persistUnitConfiguration(item,profile,u){

  const old=Array.isArray(item.unitConfiguration)?item.unitConfiguration:[];

async function reconcileItemPoints(item,opts={}){
  if(!item||!item.parentId)return null;
  const profile=await getCollectionPointsProfile(item.parentId,{inherit:true});
  if(!profile)return null;
  item.pointsProfileId=profile.id;
  let mapping=await pointMapping(profile,item);
  let unit=mapping&&findUnitByMapping(profile,mapping);
  if(mapping&&mapping.skipped){item.pointsProfileId=profile.id;await DB.put('items',item);return{profile,mapping,unit:null,cfg:[],spare:sq0(item)}}
  if(!unit){
    const c=pointsCandidates(item,profile);
    if(c.type==='exact'&&c.matches.length===1){unit=c.matches[0].u;mapping=await savePointMapping(profile,item,unit,'exact',1,!isVariableSizeUnit(unit))}
    else if(c.type==='alias'&&c.matches.length===1){unit=c.matches[0].u;mapping=await savePointMapping(profile,item,unit,'alias',1,!isVariableSizeUnit(unit))}
    else if(c.type==='fuzzy'){
      const top=c.matches[0];
      if(top&&top.score>=POINTS_FUZZY_MIN){
        const pick=await chooseFuzzyUnit(item,profile,c.matches);if(pick){unit=pick.u;mapping=await savePointMapping(profile,item,unit,'fuzzy',pick.score,!isVariableSizeUnit(pick.u));await offerRenameToUnit(item,unit)}
      }
    }
  }

    const r=await persistUnitConfiguration(item,profile,unit);
    if(mapping&&mapping.variable&&!mapping.confirmed&&!opts.keepUnconfirmed)mapping=await savePointMapping(profile,item,unit,mapping.method,mapping.score,false);
    else if(mapping&&mapping.variable===undefined)mapping=await savePointMapping(profile,item,unit,mapping.method,mapping.score,!isVariableSizeUnit(unit));
    else if(mapping&&!mapping.variable&&isVariableSizeUnit(unit))mapping=await savePointMapping(profile,item,unit,mapping.method,mapping.score,false);
    return{profile,mapping,unit,...r};
  }
  item.pointsProfileId=profile.id;await DB.put('items',item);
  return{profile,mapping:null,unit:null,cfg:[],spare:sq0(item)};
}
async function reconcileCollectionPoints(collectionId){

  const[cols,items]=await Promise.all([DB.all('collections'),DB.all('items')]),by=new Map(cols.map(c=>[c.id,c])),root=by.get(collectionId);
  if(!root)return;
  const ids=new Set([collectionId]);for(let more=true;more;){more=false;cols.forEach(c=>{if(!ids.has(c.id)&&ids.has(c.parentId)){ids.add(c.id);more=true}})}

/* ---- website: faction discovery ---- */

    if(!m)return;const slug=m[1].toLowerCase(),txt=mfmClean(a.textContent);

/* ---- GitHub YAML snapshot: faction list + files ---- */
async function mfmGithubFactions(){

  try{
    const meta=await mfmFetchText(`${gh.raw}/meta.yaml`),lines=meta.split(/\r?\n/),at=lines.findIndex(l=>/^factions:\s*$/.test(l)),slugs=[];

    if(slugs.length)return slugs.map(s=>mfmFaction(s)).sort((a,b)=>a.name.localeCompare(b.name));
  }catch(e){console.warn('GitHub faction index unavailable, trying the directory listing',e)}
  const list=JSON.parse(await mfmFetchText(gh.api)),out=(Array.isArray(list)?list:[]).map(x=>/^([a-z0-9-]+)\.ya?ml$/i.exec(x&&x.name||'')).filter(m=>m&&m[1].toLowerCase()!=='meta').map(m=>mfmFaction(m[1].toLowerCase()));

/* ---- one faction -> the same parsed shape manual YAML imports produce, plus source metadata ---- */

/* ---- collection <-> faction name matching (high confidence = pre-selected; the user still confirms) ---- */
function mfmMatchCollections(factions,cols){
  const paths=collectionPathMap(cols),cn=cols.map(c=>({c,n:pointsNorm(c.name)})).filter(x=>x.n),exact=new Set(),count=new Map();
  factions.forEach(f=>{f.match=null;const fn=pointsNorm(f.name);cn.forEach(x=>{if(x.n===fn){exact.add(x.c.id);if(!f.match)f.match={id:x.c.id,name:x.c.name,path:paths.get(x.c.id),score:1}}})});
  factions.forEach(f=>{if(f.match)return;const fn=pointsNorm(f.name);let best=null;
    cn.forEach(x=>{if(exact.has(x.c.id))return;
      const short=x.n.length<=fn.length?x.n:fn,long=x.n.length<=fn.length?fn:x.n;
      if(short.length>=3&&(' '+long+' ').includes(' '+short+' ')&&!best)best={id:x.c.id,name:x.c.name,path:paths.get(x.c.id),score:.85}});
    if(best){f.match=best;count.set(best.id,(count.get(best.id)||0)+1)}});

  factions.forEach(f=>{if(f.match)f.match.high=f.match.score>=1||count.get(f.match.id)===1});

/* ---- comparison + confirmed import of one downloaded profile ---- */

async function mfmDiscover(){
  try{toast('Contacting MFM website…');return{via:'web',factions:mfmFactionsFromHtml(await mfmFetchText(MFM_BASE))}}
  catch(e){console.warn('MFM website unavailable',e)}
  if(!await dlg({title:'Website import unavailable',msg:'Website import unavailable.\nWould you like to download the YAML version instead?',ok:'Use GitHub YAML'}))return null;
  return await mfmDiscoverGithub();
}
async function mfmDiscoverGithub(){
  try{toast('Contacting GitHub…');return{via:'github',factions:await mfmGithubFactions()}}
  catch(e){console.warn(e);toast(e&&e.linkError?e.message:'GitHub YAML is unavailable — use Import YAML with a file instead',true);return null}
}
async function mfmChooseAndDownload(found,opt={}){
  if(!found)return false;
  const[profiles,cols]=await Promise.all([DB.all('pointsProfiles'),DB.all('collections')]);
  mfmMatchCollections(found.factions,cols);
  if(opt.matchedFirst)found.factions.sort((a,b)=>(b.match?1:0)-(a.match?1:0)||a.name.localeCompare(b.name));
  if(opt.matchedFirst&&!found.factions.some(f=>f.match))toast('No collection names matched a faction — choose manually');
  const existing=new Map(profiles.map(p=>[p.slug,p])),src=found.via==='web'?'MFM website':'GitHub YAML';
  const picked=await mfmFactionModal({title:opt.title||'Available Factions',factions:found.factions,existing,sub:`${found.factions.length} factions found on the ${src}. Choose which to import.`});
  if(!picked||!picked.length)return false;
  await mfmRunBatch(picked.map(f=>({f,via:found.via,existing:existing.get(f.slug)||null,collectionId:(!existing.get(f.slug)&&f.match&&f.match.high)?f.match.id:null})),'Downloading Profiles');
  return true;
}
const ppSrc=p=>p.sourceType==='mfm-web'?'MFM website':p.sourceType==='github-yaml'?'GitHub YAML':'Manual YAML';
const mfmDownloadable=p=>p&&(p.sourceType==='mfm-web'||p.sourceType==='github-yaml');
const mfmJobFor=p=>({f:mfmFaction(p.slug,p.factionName||p.name),via:p.sourceType==='github-yaml'?'github':'web',existing:p,collectionId:null});

    }else{
      dbLinkEditing=true;renderDbLink();dbLinkInput.focus();

  });
  dbLinkInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(dbLinkEditing)saveDbLink();}}
  const openDbLink=()=>{
    const v=String(SET.get().pointsDatabaseLink||dbLinkInput.value||'').trim();if(!v)return;
    const u=normDbUrl(v);if(!u){toast('That does not look like a valid web address',true);return}

  });
  file.onchange=guard(async()=>{const f=file.files&&file.files[0],existingId=file.dataset.existing||null;file.value='';if(!f)return;

    const before=await snapshotItemPoints();

      toast(existingId?'Reading profile…':'Reading YAML…');

      const collectionId=known?null:await chooseProfileCollection(`${parsed.name} MFM`);

      if(plan.rows.some(r=>r.state==='unmatched')&&!await showMatchingModal(plan)){toast('Import cancelled — nothing was saved');return}

      lr.append(li,ob);d.append(lr);
      $('.de',d).onclick=guard(async()=>{const used=cols.filter(c=>c.pointsProfileId===p.id).length;
        const msg=used?`This profile is assigned to ${used} collection${used===1?'':'s'}. Deleting it will clear those assignments and remove the points from every model that used this profile. No collections or models will be deleted.`:'This removes the stored points profile and the points from every model that used it. No collections or models will be deleted.';
        if(!await dlg({title:'Delete points profile?',msg,ok:'Delete',danger:true}))return;
        /* purge everything this profile added: the profile record, the collection assignments, every unit mapping and unit configuration it generated, and the points link on each affected model */
        const affected=new Set((await DB.all('pointsMappings')).filter(m=>m.profileId===p.id).map(m=>m.itemId));
        const fresh=await DB.all('collections');for(const c of fresh)if(c.pointsProfileId===p.id){c.pointsProfileId=null;await DB.put('collections',c)}
        await DB.setList('pointsMappings',(await DB.all('pointsMappings')).filter(m=>m.profileId!==p.id));

        for(const it of await DB.all('items'))if(affected.has(it.id)){it.pointsProfileId=null;await DB.put('items',it)}

        /* refresh the visible vault view right away so all points disappear from cards immediately, not when the collection is next opened */

  document.body.append(sh);M.run(sh,[{transform:'translateY(100%)'},{transform:'none'}],'slow');await draw();
}

/* ---------- gestures: pinch for list/grid, tap the title or breadcrumb bar to jump to the top ---------- */
function setLayout(l){if(SET.get().layout===l)return;SET.set('layout',l);try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
 const v=live(),b=v&&$('.content',v);b&&M.run(b,[{opacity:.2,transform:'scale(.97)'},{opacity:1,transform:'none'}],'med')}
(()=>{const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);let d0=0,fired=false,wAt=0;
 stage.addEventListener('touchstart',e=>{if(e.touches.length===2){d0=dist(e.touches);fired=false}else d0=0},{passive:true});
 stage.addEventListener('touchmove',e=>{if(e.touches.length!==2||!d0||fired)return;const r=dist(e.touches)/d0;
  if(r<.78){fired=true;setLayout('grid')}else if(r>1.28){fired=true;setLayout('list')}},{passive:true});
 stage.addEventListener('touchend',e=>{if(e.touches.length<2)d0=0},{passive:true});
 stage.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const n=Date.now();if(n-wAt<450)return;wAt=n;setLayout(e.deltaY>0?'grid':'list')},{passive:false});

function handleBack(){

 const dd=$('.ddbg');if(dd){dd.click();return true}
 const bd=$('.backdrop');if(bd){bd.click();return true}

 if(sheets.length){const open=sheets.filter(x=>!x.dataset.closing);if(!open.length)return true;
  const z=x=>+getComputedStyle(x).zIndex||0,top=open.reduce((a,x)=>z(x)>=z(a)?x:a),b=$('.back',top);
  if(b){top.dataset.closing='1';b.click();return true}}
 if(SEL.size){clearSel();return true}
 if(cur!==ROOT){const b=[...crumbs.querySelectorAll('button')];if(b.length>1){b[b.length-2].click();return true}}
 return false}
(()=>{const A=plug('App');if(!A||!A.addListener)return;let last=0;
 A.addListener('backButton',()=>{if(handleBack())return;const t=Date.now();if(t-last<2000){A.exitApp&&A.exitApp();return}last=t;toast('Press back again to exit')})})();

/* soft edge fade on the filter chip rows when more chips are scrolled out of view */
(()=>{const st=document.getElementById('stage');if(!st)return;let t=0;
 const run=()=>document.querySelectorAll('.tools>.chips').forEach(c=>{const m=c.scrollWidth-c.clientWidth;c.classList.toggle('fr',m>2&&c.scrollLeft<m-2);c.classList.toggle('fl',c.scrollLeft>2)});
 const soon=()=>{cancelAnimationFrame(t);t=requestAnimationFrame(run)};
 document.addEventListener('scroll',e=>{const x=e.target;if(x&&x.classList&&x.classList.contains('chips'))soon()},true);
 addEventListener('resize',soon);new MutationObserver(soon).observe(st,{childList:true,subtree:true});soon()})();
